name: Durability

# The dirty-crash suite (H-24, contracts W1 and R2). Runs against
# docker-compose.lazyfs.yml, where PGDATA is a LazyFS mount and an un-fsynced
# write can actually be lost.
#
# Its own workflow rather than a ci_matrix case: `compose_file` lives in the
# matrix-wide cluster block, so a case cannot select a different cluster, and
# lint_matrix.py reconciles that block against topology.py. Elle and
# correctness-lite are separated for the same reason.
#
# `--prove-oracle` is what makes a green result mean anything. It runs the
# inversion first — synchronous_commit=off with the WAL flushers frozen, which
# must lose acked writes — and refuses to report on the real assertion unless
# that went red. A suite whose fault has silently stopped injecting reports
# perfect durability, so the inversion is the gate, not an extra.
on:
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "docker-compose.lazyfs.yml"
      - "config/lazyfs/**"
      - "testing/lazyfs/**"
      - "testing/durability_crash.py"
      - "testing/torn_write.py"
      - "testing/torn_raft.py"
      - "testing/fault_primitives.py"
      - "crates/pgbattery-supervisor/**"
      - "src/governor/**"
      - ".github/workflows/durability.yml"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  schedule:
    # 05:00 UTC, after fuzz (04:00) and the control-plane nightly (04:15), so
    # three container-heavy suites do not contend for the same runner.
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: durability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  dirty-crash:
    name: Dirty crash (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # cluster-crash is the R2 test: with every node dead at once, a standby
        # that acked a flush it never performed becomes observable. leader-crash
        # is W1 with a survivor, which is the failover path clients actually see.
        mode: [cluster-crash, leader-crash]
    env:
      COMPOSE_FILE: docker-compose.lazyfs.yml
      COMPOSE_PROJECT_NAME: durability-${{ github.run_id }}-${{ matrix.mode }}
      PGBATTERY_MANAGEMENT_API_TOKEN: ci-durability-token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # The FUSE mount needs /dev/fuse present on the runner. ubuntu-latest
      # ships it, but asserting beats discovering at container start that the
      # entrypoint fell back to an ordinary filesystem.
      - name: Verify FUSE is available on the runner
        run: test -c /dev/fuse

      - name: Build the LazyFS cluster
        run: docker compose -f docker-compose.lazyfs.yml build

      # No `--wait`. It gates on compose's health aggregation across services,
      # which reports a node still in `health: starting` as unhealthy once a
      # sibling has gone healthy, and aborts with every container in fact fine.
      # The suite waits on what it actually needs — a writable leader, and a
      # running PostgreSQL on each node it is about to crash.
      - name: Start the cluster
        run: docker compose -f docker-compose.lazyfs.yml up -d

      # cluster-crash proves the fault first and then asserts. leader-crash
      # cannot: weakening synchronous_commit does not lose an acked write while
      # a standby survives to flush the streamed WAL, so its inversion would
      # only go red by outrunning replication. It shares the primitive with
      # cluster-crash, which is where that primitive is proven.
      - name: Prove the oracle can fail, then assert durability
        if: matrix.mode == 'cluster-crash'
        run: |
          uv run --project testing python testing/durability_crash.py \
            --mode cluster-crash \
            --writes 500 \
            --prove-oracle

      - name: Assert durability with a survivor
        if: matrix.mode == 'leader-crash'
        run: |
          uv run --project testing python testing/durability_crash.py \
            --mode leader-crash \
            --writes 500

      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p artifacts
          docker compose -f docker-compose.lazyfs.yml logs --no-color > artifacts/compose.log 2>&1 || true
          docker compose -f docker-compose.lazyfs.yml ps -a > artifacts/ps.txt 2>&1 || true
          for n in node1 node2 node3; do
            docker compose -f docker-compose.lazyfs.yml exec -T --user root "$n" \
              sh -c 'grep postgresql/data /proc/mounts' > "artifacts/$n.mounts.txt" 2>&1 || true
          done

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: durability-${{ matrix.mode }}-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.lazyfs.yml down -v || true

  torn-write:
    name: Torn write (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # heap exercises the full-page image; wal the record CRC; control the
        # control-file CRC. Different structures with different defences, so a
        # green on one says nothing about the others.
        target: [heap, wal, control]
    env:
      COMPOSE_FILE: docker-compose.lazyfs.yml
      COMPOSE_PROJECT_NAME: tornwrite-${{ github.run_id }}-${{ matrix.target }}
      # Required to interpolate the file, which the node services reference
      # even when only `pg` is started. Nothing here serves the API.
      PGBATTERY_MANAGEMENT_API_TOKEN: ci-tornwrite-token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Verify FUSE is available on the runner
        run: test -c /dev/fuse

      # Only the bare-PostgreSQL sidecar. node1..node3 stay down: the property
      # under test is PostgreSQL's handling of a half-written page, and a
      # cluster would put a failover and a possible re-basebackup between the
      # tear and the assertion.
      - name: Start the torn-write node
        run: docker compose --profile tornwrite up -d --build --wait pg

      - name: Prove the oracle can fail, then assert torn-write handling
        run: |
          uv run --project testing python testing/torn_write.py \
            --target ${{ matrix.target }} --prove-oracle

      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p artifacts
          docker compose --profile tornwrite logs --no-color pg > artifacts/pg.log 2>&1 || true
          docker compose --profile tornwrite exec -T --user root pg \
            sh -c 'cat /tmp/lazyfs.log' > artifacts/lazyfs.log 2>&1 || true
          docker compose --profile tornwrite exec -T --user root pg \
            sh -c 'cat /tmp/pg.log' > artifacts/postmaster.log 2>&1 || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tornwrite-${{ matrix.target }}-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Tear down
        if: always()
        run: docker compose --profile tornwrite down -v || true

  torn-raft:
    name: Torn write (Raft store, ${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The leader is the harder case: its vote and log are what the cluster
        # is relying on at the moment the store is torn.
        target: [follower, leader]
    env:
      COMPOSE_FILE: docker-compose.lazyfs.yml
      COMPOSE_PROJECT_NAME: tornraft-${{ github.run_id }}-${{ matrix.target }}
      PGBATTERY_MANAGEMENT_API_TOKEN: ci-tornraft-token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Verify FUSE is available on the runner
        run: test -c /dev/fuse

      # No `--wait` — see the dirty-crash job. The suite's first assertion is
      # that the Raft store is on LazyFS, and it waits for that mount itself
      # rather than trusting compose to have finished making it.
      - name: Start the cluster
        run: docker compose up -d --build node1 node2 node3

      # The inversion mangles one node's raft.db past repair and requires it to
      # stop rather than run on it, then rebuilds the cluster. Without that a
      # green run could not be told apart from a fault that injected nothing.
      #
      # A FIFO torn-op fires on the next write to the path, and redb opens
      # every commit with its 320-byte header, so this step always tears the
      # header and a parts=2 tear persists 160 bytes of it. --min-torn-bytes is
      # set below what the header produces and above nothing, so the run still
      # fails loudly if the fault stops landing at all.
      - name: Prove the oracle can fail, then tear the Raft store's header
        run: |
          uv run --project testing python testing/torn_raft.py \
            --prove-oracle --target ${{ matrix.target }} --tears 1 \
            --min-torn-bytes 128 --attempts 12

      # The other structure. Reaching a committed btree page needs occurrence
      # selection, which only a config-baked injection honours, so this pays a
      # restart to aim past the writes the victim makes rejoining. It asserts
      # the tear landed off offset 0 and refuses to report the header case as
      # this one. See HARDENING H-48.
      - name: Tear a committed btree page
        run: |
          uv run --project testing python testing/torn_raft.py \
            --structure page --target ${{ matrix.target }}

      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p artifacts
          docker compose logs --no-color > artifacts/compose.log 2>&1 || true
          for n in node1 node2 node3; do
            docker compose exec -T --user root "$n" \
              sh -c 'cat /tmp/lazyfs-raft.log' > "artifacts/$n.lazyfs-raft.log" 2>&1 || true
          done

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tornraft-${{ matrix.target }}-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Tear down
        if: always()
        run: docker compose down -v || true

  wal-enospc:
    name: ENOSPC at WAL-segment allocation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # The ordinary compose file, not the LazyFS one. This measures what
      # PostgreSQL does when it cannot allocate a WAL segment, which needs a
      # filesystem with a real ceiling rather than one that can lose writes.
      COMPOSE_PROJECT_NAME: enospc-${{ github.run_id }}
      PGBATTERY_MANAGEMENT_API_TOKEN: ci-enospc-token
      # tmpfs volumes with a hard `size=`. Docker's local driver has no quota,
      # so against the default volumes a fill can never reach ENOSPC and the
      # primitive refuses to run rather than filling the runner's disk.
      PGBATTERY_STATE_SUFFIX: _bounded
      # 2 GiB rather than the 4 GiB default: the fill is RAM, and the suite
      # fills one node down to half a WAL segment, so a smaller ceiling is a
      # cheaper fill without weakening anything.
      PGBATTERY_BOUNDED_STATE_SIZE: 2g
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # Built before `up` so the three node images do not link concurrently.
      # They are byte-identical and this project sets `lto = true` with
      # `codegen-units = 1`, so three parallel release links is a large enough
      # memory spike to take a small Docker host down. node2 and node3 hit the
      # build cache.
      - name: Build one node image, then start the cluster
        run: |
          docker compose build node1
          docker compose up -d

      # The suite waits for a writable leader itself, so no `--wait` here for
      # the same reason as the jobs above.
      #
      # --prove-oracle runs the identical sequence with no fill first and
      # requires the effect to be ABSENT. That is what makes the signal
      # attributable: if writes fail and leadership moves in a cluster nobody
      # touched, seeing the same under a full disk says nothing about disk
      # exhaustion.
      - name: Prove the oracle can fail, then assert W1 under ENOSPC
        run: |
          uv run --project testing python testing/wal_enospc.py \
            --writes 150 --prove-oracle

      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p artifacts
          docker compose logs --no-color > artifacts/compose.log 2>&1 || true
          docker compose ps -a > artifacts/ps.txt 2>&1 || true
          for n in node1 node2 node3; do
            docker compose exec -T --user root "$n" \
              sh -c 'df -k /var/lib/postgresql' > "artifacts/$n.df.txt" 2>&1 || true
          done

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: enospc-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Tear down
        if: always()
        run: docker compose down -v || true
