name: Fuzz

# Three budgets over the same eight targets:
#   * pull_request — 30 s/target smoke. Catches an assertion a change just
#     broke, cheap enough to gate every PR that touches a fuzzed surface.
#   * push to main — 120 s/target. The merged tree gets a real (if short) run.
#   * Sunday schedule — 900 s/target, 2 h of sustained fuzzing across the
#     matrix. This is where new coverage actually comes from; the smoke runs
#     mostly replay the committed seed corpus.
#
# Every run starts from fuzz/seed_corpus/<target>/ (committed, read-only) plus
# fuzz/corpus/<target>/ (this run's working corpus, restored from the cache),
# so a run is never cold.
on:
  pull_request:
    branches: [main]
    paths:
      # The gateway is the internet-facing parser surface; four of the seven
      # targets cover it, so a PR touching any of it must fuzz.
      - "src/gateway/**"
      - "src/config/constants.rs"
      - "src/governor/state_machine.rs"
      - "src/governor/storage.rs"
      - "src/governor/raft.rs"
      - "src/governor/network.rs"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  schedule:
    # Sunday 04:00 UTC — runs after correctness-lite (03:30) so a flaky
    # cluster doesn't crowd CI.
    - cron: "0 4 * * 0"
  workflow_dispatch:

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'schedule' }}

# Deny-all by default; each job re-grants only the scopes it needs.
permissions: {}

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    # The scheduled run fuzzes for 15 min/target on top of a cold-cache
    # sanitizer build, which does not fit the smoke-run budget.
    timeout-minutes: ${{ github.event_name == 'schedule' && 45 || 20 }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - parse_lsn
          - cluster_commands
          - gateway_startup
          - gateway_framing
          - gateway_extended_protocol
          - gateway_query_analysis
          - raft_record_decode
          - raft_rpc_frame
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # cargo-fuzz needs a nightly toolchain for the libFuzzer + sanitizer
      # instrumentation (-Zsanitizer=address). The pinned v1 action has no default
      # channel, so nightly is requested explicitly here; fuzz/rust-toolchain.toml
      # also selects nightly for everything under fuzz/ (rustup resolves the
      # nearest toolchain file to the cwd), so the `cargo fuzz` step below runs on
      # nightly while the rest of the project stays on 1.97.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: nightly

      # ~/.cargo/bin is cached alongside the build artifacts so the cargo-fuzz
      # install below is a no-op on a warm cache. With seven parallel jobs that
      # is the single largest chunk of avoidable CI time here.
      - name: Cache cargo registry + fuzz target dir
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            fuzz/target/
          key: fuzz-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('fuzz/Cargo.toml', 'fuzz/Cargo.lock', 'fuzz/fuzz_targets/${{ matrix.target }}.rs') }}
          restore-keys: |
            fuzz-${{ runner.os }}-${{ matrix.target }}-
            fuzz-${{ runner.os }}-

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # libFuzzer writes newly-discovered inputs into the FIRST corpus
      # directory, so the working corpus is listed first and the committed seed
      # corpus second — generated inputs never land in the committed tree.
      - name: Run fuzzer
        env:
          FUZZ_DURATION: ${{ github.event_name == 'schedule' && '900' || (github.event_name == 'push' && '120' || '30') }}
        run: |
          set -euo pipefail
          cd fuzz
          mkdir -p "corpus/${{ matrix.target }}" "seed_corpus/${{ matrix.target }}"
          cargo fuzz run "${{ matrix.target }}" \
            "corpus/${{ matrix.target }}" \
            "seed_corpus/${{ matrix.target }}" \
            -- \
            -max_total_time="${FUZZ_DURATION}" \
            -timeout=10 \
            -print_final_stats=1

      - name: Upload crashing inputs (if any)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashes-${{ matrix.target }}-${{ github.run_id }}
          path: |
            fuzz/artifacts/${{ matrix.target }}/
            fuzz/corpus/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 30
