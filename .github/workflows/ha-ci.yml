name: HA CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      run_controlplane_nightly:
        description: "Also run the heavy ha-controlplane-nightly suite"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "15 4 * * *"

# A new push to a PR/branch cancels the in-progress run so reviewers wait
# only on the latest commit. main + scheduled runs are exempt so we don't
# lose nightly signal or post-merge confirmation.
concurrency:
  group: ha-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'schedule' }}

# Deny-all by default; each job re-grants only the scopes it needs.
permissions: {}

env:
  # Every HA suite brings up the docker-compose cluster, whose compose file
  # hard-requires PGBATTERY_MANAGEMENT_API_TOKEN (the `:?` guard aborts compose
  # in <1s if it is unset). A fixed CI value is fine — it only gates the
  # management API inside the ephemeral per-run cluster, and ci_runner.py reads
  # the same env var for its own authenticated calls. (elle.yml and
  # correctness-lite.yml already set this; ha-ci.yml was the workflow that
  # missed it, which is why all 8 HA jobs failed at compose bring-up.)
  PGBATTERY_MANAGEMENT_API_TOKEN: ci-ha-token

jobs:
  lint-test-harness:
    name: Lint Test Harness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Ruff format check
        run: uv run --project testing ruff format --check testing/

      - name: Ruff lint check
        run: uv run --project testing ruff check testing/

      - name: Mypy strict
        run: uv run --project testing mypy testing/ --strict

      - name: Lint matrix, SQL, and Python scripts
        run: uv run --python 3.14 --script testing/lint_matrix.py

      # Every time comparison that gates write authority must run on the one
      # injectable clock, or a ManualClock cannot drive the state machine and
      # the lease, promotion hold-down, and async-fallback grace can disagree
      # under test while agreeing in production by accident.
      - name: Lint clock injection in safety modules
        run: uv run --python 3.14 --script testing/lint_clock_injection.py

      # Offline unit tests for the harness itself: checker sanity (proves the
      # consistency checkers can fail), invariant classification, runner
      # plumbing, fault-primitive parsing. No cluster or Docker required.
      # A checker that cannot fail is worse than no checker, so these gate CI.
      - name: Harness unit tests
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(testing/test_*.py)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No testing/test_*.py found — the harness unit tests have vanished."
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "=== $f ==="
            uv run --project testing python "$f"
          done

  ha-sequential:
    needs: lint-test-harness
    name: HA Sequential
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      COMPOSE_PROJECT_NAME: pgbha_seq_${{ github.run_id }}_${{ github.run_attempt }}
      # Linux runners route the compose bridge, so the prober must probe the
      # internal ports directly. Without this a docker-exec fallback would
      # report exactly like a direct probe and the routability claim would go
      # untested. Deliberately not set locally: Docker Desktop cannot route it.
      PGBATTERY_PROBER_REQUIRE_TRANSPORT: direct
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Show Docker Compose version
        run: docker compose version

      - name: Run deterministic sequential HA suite
        run: ./testing/ci_runner.py --suite ha-sequential --artifact-dir testing/artifacts/ha-sequential

      - name: Upload sequential HA artifacts (failure only)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ha-sequential-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: testing/artifacts/ha-sequential
          if-no-files-found: ignore
          retention-days: 14

      - name: Force cleanup docker compose resources
        if: always()
        run: docker compose down -v --remove-orphans || true

  ha-parallel-cases:
    name: HA Parallel (enumerate)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      cases: ${{ steps.enumerate.outputs.cases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      # Derived from the suite, never restated here: a hardcoded list left
      # twelve of seventeen cases executed by no workflow at all. A case is
      # omitted only by carrying a `ci_excluded_reason` in the matrix.
      - name: Enumerate runnable cases
        id: enumerate
        run: echo "cases=$(./testing/ci_runner.py --suite ha-parallel --emit-cases)" >> "$GITHUB_OUTPUT"

  ha-parallel:
    name: HA Parallel (${{ matrix.case }})
    runs-on: ubuntu-latest
    needs: ha-parallel-cases
    if: github.event_name != 'schedule'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(needs.ha-parallel-cases.outputs.cases) }}
    permissions:
      contents: read
    env:
      COMPOSE_PROJECT_NAME: pgbha_${{ matrix.case }}_${{ github.run_id }}_${{ github.run_attempt }}
      # Linux runners route the compose bridge, so the prober must probe the
      # internal ports directly. Without this a docker-exec fallback would
      # report exactly like a direct probe and the routability claim would go
      # untested. Deliberately not set locally: Docker Desktop cannot route it.
      PGBATTERY_PROBER_REQUIRE_TRANSPORT: direct
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Show Docker Compose version
        run: docker compose version

      - name: Run deterministic parallel HA case
        run: ./testing/ci_runner.py --suite ha-parallel --case ${{ matrix.case }} --artifact-dir testing/artifacts/ha-parallel-${{ matrix.case }}

      - name: Upload parallel HA artifacts (failure only)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ha-parallel-${{ matrix.case }}-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: testing/artifacts/ha-parallel-${{ matrix.case }}
          if-no-files-found: ignore
          retention-days: 14

      - name: Force cleanup docker compose resources
        if: always()
        run: docker compose down -v --remove-orphans || true

  ha-controlplane-pr:
    name: HA Control Plane PR
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      COMPOSE_PROJECT_NAME: pgbha_cppr_${{ github.run_id }}_${{ github.run_attempt }}
      # Linux runners route the compose bridge, so the prober must probe the
      # internal ports directly. Without this a docker-exec fallback would
      # report exactly like a direct probe and the routability claim would go
      # untested. Deliberately not set locally: Docker Desktop cannot route it.
      PGBATTERY_PROBER_REQUIRE_TRANSPORT: direct
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Show Docker Compose version
        run: docker compose version

      - name: Run control-plane PR suite
        run: ./testing/ci_runner.py --suite ha-controlplane-pr --artifact-dir testing/artifacts/ha-controlplane-pr

      - name: Upload control-plane PR artifacts (failure only)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ha-controlplane-pr-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: testing/artifacts/ha-controlplane-pr
          if-no-files-found: ignore
          retention-days: 14

      - name: Force cleanup docker compose resources
        if: always()
        run: docker compose down -v --remove-orphans || true

  ha-assert-sanity:
    name: Assert Sanity (invert-expected-result)
    needs: lint-test-harness
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      COMPOSE_PROJECT_NAME: pgbha_assertsanity_${{ github.run_id }}_${{ github.run_attempt }}
      # Linux runners route the compose bridge, so the prober must probe the
      # internal ports directly. Without this a docker-exec fallback would
      # report exactly like a direct probe and the routability claim would go
      # untested. Deliberately not set locally: Docker Desktop cannot route it.
      PGBATTERY_PROBER_REQUIRE_TRANSPORT: direct
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Show Docker Compose version
        run: docker compose version

      - name: Run assert-sanity suite (verifies assertions can fail)
        run: ./testing/ci_runner.py --suite ha-assert-sanity --artifact-dir testing/artifacts/ha-assert-sanity

      - name: Upload assert-sanity artifacts (failure only)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ha-assert-sanity-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: testing/artifacts/ha-assert-sanity
          if-no-files-found: ignore
          retention-days: 14

      - name: Force cleanup docker compose resources
        if: always()
        run: docker compose down -v --remove-orphans || true

  # H-16's cases had self-tests in CI and no runner: `join_edges.py` was driven
  # by hand and nothing else, so a regression in a join edge could only be found
  # by someone going looking for it.
  join-edges:
    name: Join and rejoin edges (H-16)
    needs: lint-test-harness
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      COMPOSE_PROJECT_NAME: pgbha_joinedges_${{ github.run_id }}_${{ github.run_attempt }}
      PGBATTERY_MANAGEMENT_API_TOKEN: ci-joinedges-token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Start the cluster
        run: docker compose up -d --build node1 node2 node3

      - name: Drive the join and rejoin edges
        run: uv run --project testing python testing/join_edges.py --token ci-joinedges-token

      - name: Collect diagnostics
        if: failure()
        run: docker compose logs --no-color --tail 4000 > compose.log || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: join-edges-${{ github.run_id }}-${{ github.run_attempt }}
          path: compose.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans || true

  ha-controlplane-nightly:
    name: HA Control Plane Nightly
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_controlplane_nightly == 'true')
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      COMPOSE_PROJECT_NAME: pgbha_cpnightly_${{ github.run_id }}_${{ github.run_attempt }}
      # Linux runners route the compose bridge, so the prober must probe the
      # internal ports directly. Without this a docker-exec fallback would
      # report exactly like a direct probe and the routability claim would go
      # untested. Deliberately not set locally: Docker Desktop cannot route it.
      PGBATTERY_PROBER_REQUIRE_TRANSPORT: direct
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Show Docker Compose version
        run: docker compose version

      - name: Run control-plane nightly suite
        run: ./testing/ci_runner.py --suite ha-controlplane-nightly --artifact-dir testing/artifacts/ha-controlplane-nightly

      - name: Upload control-plane nightly artifacts (always)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ha-controlplane-nightly-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: testing/artifacts/ha-controlplane-nightly
          if-no-files-found: ignore
          retention-days: 14

      - name: Force cleanup docker compose resources
        if: always()
        run: docker compose down -v --remove-orphans || true
