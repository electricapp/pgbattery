version: 2
updates:
  # Rust dependencies (Cargo.toml / Cargo.lock). The fuzz crate lives outside
  # the workspace with its own lockfile that path-depends on the root crate,
  # so both directories update together — otherwise every root dep bump
  # strands fuzz/Cargo.lock and the --locked fuzz clippy job fails.
  - package-ecosystem: "cargo"
    directories: ["/", "/fuzz"]
    schedule:
      interval: "daily"
    commit-message:
      prefix: "deps(rust)"
    open-pull-requests-limit: 99
    labels:
      - "dependencies"
      - "rust"
    groups:
      cargo:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
          - "major"
    ignore:
      # x509-cert must stay on the same version sigstore-rs itself uses
      # (see Cargo.toml): a solo bump splits the graph into two x509-cert
      # versions whose cert types don't unify. Bump it manually, together
      # with sigstore.
      - dependency-name: "x509-cert"

  # GitHub Actions workflows — Dependabot bumps both the SHA pin and the
  # trailing version comment.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "deps(actions)"
    open-pull-requests-limit: 99
    labels:
      - "dependencies"
      - "actions"
    groups:
      actions:
        patterns:
          - "*"

  # Docker base image(s) for the container build.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "deps(docker)"
    open-pull-requests-limit: 99
    labels:
      - "dependencies"
      - "docker"
    groups:
      docker:
        patterns:
          - "*"
