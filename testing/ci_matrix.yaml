      "id": "network-loss-stability",
      "tests_md_ref": "Control Plane 33. Packet Loss on a Follower [W1, V1]",
      "contracts": [
        "W1",
        "V1"
      ],
      "description": "The matrix's only packet-loss fault. Everything else network-shaped here is either binary (iptables DROP, docker network disconnect) or pure added latency (tc netem delay), and lossy links fail differently: retransmit timers, partial Raft frames, and walsender stalls instead of clean unreachability. The Elle harness has had a network_loss attack all along with no counterpart here. 30% egress loss is applied to node3's eth0 only, so node1 keeps a clean path to node2 and quorum is never at risk; a 25-row batch is then acked under the loss and must be intact at the end, and node3 must catch back up to synced once the loss is removed. Leader stability is deliberately NOT asserted: 30% loss on node3's own interface can drop four consecutive 250 ms heartbeats (0.3^4 per election window) often enough over the fault window that node3 legitimately starts and loses an election, so the property being claimed is one leader plus intact data, not the same leader.",
