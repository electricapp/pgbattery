          "type": "cluster_topology",
          "nodes": 3,
          "leaders": 1
        },
        {
          "type": "cmd",
          "comment": "False-positive regression: after a fully-graceful transfer cascade with all nodes caught up, the rewind data-loss gate must NOT have fired on any node. A non-zero counter here means the gate triggered during a scenario it should have allowed \u2014 false positive that would deadlock failover.",
          "cmd": "for p in 9091 9092 9093; do COUNT=$(curl -s http://localhost:$p/metrics | awk '/^pgbattery_pg_rewind_refused_data_loss_risk/{print $2}' | head -1); COUNT=${COUNT:-0}; echo \"port $p: $COUNT\"; [ \"$(echo \"$COUNT\" | cut -d. -f1)\" -eq 0 ] || (echo \"FALSE POSITIVE: rewind gate fired on port $p (count=$COUNT)\"; exit 1); done"
