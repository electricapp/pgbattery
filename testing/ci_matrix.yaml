        "V2"
      ],
      "description": "A disk-full fault that is actually reachable, and that proves it before asserting anything else. REQUIRES the run to select the size-bounded state volumes: docker-compose.yml maps node<N>_state${PGBATTERY_STATE_SUFFIX} and the suffix defaults to empty, i.e. ordinary unbounded named volumes on which ENOSPC is not reachable at all. Run this case with PGBATTERY_STATE_SUFFIX=_bounded (tmpfs, PGBATTERY_BOUNDED_STATE_SIZE, default 4g). The case does not assume that was done: it fills node3's volume and then REQUIRES the filesystem to report under 64 MB available, so an unbounded run fails loudly with that instruction instead of passing while testing nothing. The fill is sized from the reported free space plus a small overshoot, under a hard 5120 MiB ceiling, which bounds the write on an unbounded volume rather than writing until the runner's root filesystem is gone. In bounded mode the volume is RAM-backed tmpfs, so the fill costs memory: exactly one node is filled, and it is freed in cleanup unconditionally. With node3 out of space, the properties under test are that the cluster keeps exactly one leader (V1), that the leader stays writable through a healthy node2 while a follower's storage is exhausted (W1 \u2014 the 25-row mid batch must ack), and that node3 resyncs to zero lag on its own once space is returned (V2).",
      "actions": [
        {
          "type": "transfer_leadership",
          "comment": "Leadership on node1 and the fault on node3, so the leader always has a healthy sync candidate in node2 and commits are never expected to block.",
          "target_node_id": 1
        },
        {
          "type": "wait_cluster",
          "nodes": 3,
          "leaders": 1,
          "timeout_sec": 60
        },
        {
          "type": "wait_sync",
          "timeout_sec": 60
        },
        {
          "type": "sql",
          "file": "chaos-oracle-setup.sql",
          "node": "leader"
        },
        {
          "type": "cmd",
          "comment": "Fill node3's PostgreSQL volume (mounted at /var/lib/postgresql), sized from its own reported free space so the fill adapts to PGBATTERY_BOUNDED_STATE_SIZE instead of hard-coding it, capped at 5120 MiB so an unbounded volume costs 5 GiB rather than the whole host disk. Then gate on the filesystem actually being full: the `avail < 64 MB` check is the anti-vacuity guard, and it is what turns an unbounded run from a silent pass into a failure.",
          "cmd": "docker compose exec -T --user root node3 sh -c 'A=$(df -m --output=avail /var/lib/postgresql | tail -1 | tr -d \" \"); N=$((A + 64)); [ \"$N\" -gt 5120 ] && N=5120; echo \"filling ${N}MB of ${A}MB available\"; dd if=/dev/zero of=/var/lib/postgresql/ci_disk_fill bs=1M count=$N 2>&1 | tail -1; sync; df -m /var/lib/postgresql | tail -1'; AVAIL=$(docker compose exec -T node3 sh -c 'df -m --output=avail /var/lib/postgresql | tail -1' | tr -d '[:space:]'); echo \"node3 avail=${AVAIL}MB\"; [ \"${AVAIL:-999999}\" -lt 64 ] || { echo 'FAIL: node3 PostgreSQL volume still has space after the fill \u2014 ENOSPC is unreachable and this case would be vacuous. Re-run with PGBATTERY_STATE_SUFFIX=_bounded so docker-compose.yml selects the size-bounded tmpfs volumes.'; exit 1; }"
        },
        {
          "type": "sql",
          "comment": "25 rows acked while node3 is out of space. Quorum and sync both run through node2, so this must succeed; if it blocks, the leader was waiting on the exhausted replica. shell_timeout_sec is tightened from the 600s default so that blocking is reported promptly: an ENOSPC replica that the leader still counts as a required sync standby stalls commits indefinitely, and the whole point of the case is to catch that, not to wait it out.",
          "file": "chaos-oracle-mid.sql",
          "node": "leader",
          "shell_timeout_sec": 120
        },
        {
          "type": "cmd",
          "comment": "Return the space. node3's PostgreSQL may have PANICked and be in a Docker restart cycle at this point, which is the expected reaction \u2014 the recovery path is what the wait_sync below measures.",
          "cmd": "docker compose exec -T --user root node3 rm -f /var/lib/postgresql/ci_disk_fill; docker compose exec -T node3 sh -c 'df -m /var/lib/postgresql | tail -1'"
        },
        {
          "type": "wait_cluster",
          "nodes": 3,
          "leaders": 1,
          "timeout_sec": 180,
          "comment": "node3 may need a full basebackup resync after ENOSPC damage; 180s matches the storage-fault-recovery budget."
        },
        {
          "type": "wait_sync",
          "nodes": [
            3
          ],
          "timeout_sec": 120,
          "comment": "V2: node3 rejoins and catches up with no operator intervention."
        },
        {
          "type": "sql",
          "file": "chaos-oracle-post.sql",
          "node": "leader"
        }
      ],
      "assertions": [
        {
          "type": "cluster_topology",
          "nodes": 3,
          "leaders": 1
        },
        {
          "type": "sql",
          "file": "chaos-oracle-assert-full.sql",
          "node": "leader"
        }
      ],
      "cleanup": [
        {
          "type": "cmd",
          "comment": "Remove the fill file unconditionally: leaving it behind would starve every subsequent case in the suite.",
          "cmd": "docker compose exec -T --user root node3 rm -f /var/lib/postgresql/ci_disk_fill 2>/dev/null || true",
          "expect_exit": null
        },
        {
          "type": "wait_cluster",
          "nodes": 3,
          "leaders": 1,
          "timeout_sec": 180
        }
      ]
