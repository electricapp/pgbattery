      "id": "cascade-double-failover-wedge",
      "tests_md_ref": "BUGS.md: cluster wedges when chaos arrives faster than node recovery",
      "contracts": [
        "W1",
        "W2",
        "V1"
      ],
      "description": "Kill the leader THREE times in close succession under sustained concurrent write load. Each kill happens BEFORE the previous killed node has fully completed pg_basebackup. The interleaving leaves only one voter healthy at the moment of kill #3 \u2192 no quorum \u2192 the cluster's only path back is the leaderless watchdog forcing an election once the recovering nodes' Raft comes back. Without the widened watchdog stagger, multiple voters' forced elections collide (term tangle) and the cluster stays wedged for minutes. With fix: lowest-id voter elects cleanly and cluster recovers within 90s. Two data oracles run on top of that liveness check, because this is the heaviest fault pressure in the matrix and it must yield a correctness signal, not just a heartbeat: the 100 rows acked before the cascade must be present exactly once on the recovered leader, and every 200-row worker batch that materialised at all must be complete \u2014 a batch is one statement, hence one transaction, so 1..199 rows is a lost-atomicity violation and >200 is a duplicate replay. Whether a given batch was acked is genuinely indeterminate here, so per-batch atomicity is the strongest non-flaky property available (same precedent as concurrent-writes-failover).",
      "actions": [
        {
          "type": "sql",
          "file": "concurrent-writes-setup.sql",
          "node": 1
        },
        {
          "type": "sql",
          "comment": "100 acked rows before any kill. These are not indeterminate \u2014 the step fails if the commit is not acknowledged \u2014 so they must survive all three kills.",
          "file": "chaos-oracle-setup.sql",
          "node": "leader"
        },
        {
          "type": "cmd",
          "comment": "Start sustained background write load via the gateway (3 parallel loopers). They keep firing until the gateway is unreachable.",
          "cmd": "for w in 1 2 3; do (for i in $(seq 1 100); do timeout 3 psql -h 127.0.0.1 -p 5432 -U postgres -c \"INSERT INTO ci_concurrent_writes(worker_id,seq) SELECT $w, generate_series((($i-1)*200)+1, $i*200);\" 2>/dev/null; done) & done; echo started"
        },
        {
          "type": "sleep",
          "seconds": 3,
          "comment": "let WAL build up"
        },
        {
          "type": "cmd",
          "comment": "kill #1",
          "cmd": "L=$(for p in 9081 9082 9083; do curl -s -m 2 http://localhost:$p/api/v1/cluster/leader 2>/dev/null | grep -oE '\"leader_id\":[0-9]+' | cut -d: -f2 && break; done); echo \"kill #1: node$L\"; docker compose kill node$L"
        },
        {
          "type": "sleep",
          "seconds": 4,
          "comment": "election + restart kick-off"
        },
        {
          "type": "cmd",
          "comment": "restart killed node",
          "cmd": "for n in 1 2 3; do docker compose start node$n 2>&1 > /dev/null; done"
        },
        {
          "type": "sleep",
          "seconds": 4,
          "comment": "node mid-basebackup. Kill new leader."
        },
        {
          "type": "cmd",
          "comment": "kill #2",
          "cmd": "L=$(for p in 9081 9082 9083; do curl -s -m 2 http://localhost:$p/api/v1/cluster/leader 2>/dev/null | grep -oE '\"leader_id\":[0-9]+' | cut -d: -f2 && break; done); echo \"kill #2: node$L\"; docker compose kill node$L"
        },
        {
          "type": "sleep",
          "seconds": 3
        },
        {
          "type": "cmd",
          "comment": "restart again",
          "cmd": "for n in 1 2 3; do docker compose start node$n 2>&1 > /dev/null; done"
        },
        {
          "type": "sleep",
          "seconds": 4,
          "comment": "give MOST recent leader time, but kill before fully settled"
        },
        {
          "type": "cmd",
          "comment": "kill #3 \u2014 by now multiple nodes are in various recovery states",
          "cmd": "L=$(for p in 9081 9082 9083; do curl -s -m 2 http://localhost:$p/api/v1/cluster/leader 2>/dev/null | grep -oE '\"leader_id\":[0-9]+' | cut -d: -f2 && break; done); echo \"kill #3: node$L\"; if [ -n \"$L\" ]; then docker compose kill node$L; else echo 'no leader to kill \u2014 already wedged'; fi"
        },
        {
          "type": "sleep",
          "seconds": 5
        },
        {
          "type": "cmd",
          "comment": "bring back everything; the watchdog now needs to recover from arbitrary chaos state",
          "cmd": "for n in 1 2 3; do docker compose start node$n 2>&1 > /dev/null; done; wait 2>/dev/null; true"
        },
        {
          "type": "wait_cluster",
          "nodes": 3,
          "leaders": 1,
          "timeout_sec": 90,
          "require_replication_health": false,
          "comment": "After 3-kill cascade under load, test goal is leader+topology recovery (matches the assertion below). A trailing follower still catching up via basebackup is expected and shouldn't fail the case."
        }
      ],
      "assertions": [
        {
          "type": "cluster_topology",
          "nodes": 3,
          "leaders": 1
        },
        {
          "type": "sql",
          "comment": "Acked-before-the-cascade rows must be readable exactly once on the recovered leader.",
          "file": "chaos-oracle-assert-survived.sql",
          "node": "leader"
        },
        {
          "type": "sql",
          "comment": "Per-batch atomicity for the three background workers' ~60,000 rows, which were previously discarded in cleanup without ever being read.",
          "file": "cascade-write-atomicity-assert.sql",
          "node": "leader"
        }
      ],
      "cleanup": [
        {
          "type": "cmd",
          "comment": "drop the workload table",
          "cmd": "docker compose exec -T node1 psql -U postgres -h 127.0.0.1 -p 5434 -c 'DROP TABLE IF EXISTS ci_concurrent_writes;' 2>/dev/null || true"
