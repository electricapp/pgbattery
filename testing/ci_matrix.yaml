    {
      "id": "promotion-holddown-clock-step",
      "tests_md_ref": "Control Plane 28. Promotion Lease Hold-Down vs Forward Wall-Clock Step [L1, W1]",
      "contracts": [
        "L1",
        "W1"
      ],
      "description": "Targets the one combination the other four skew cases cannot reach: a forward WALL-CLOCK step applied to the node that is about to win an election, landing between that node observing leader-loss and its promote check. EXPECTED OUTCOME: this case PASSES when the promotion hold-down measures elapsed time on the monotonic clock, and FAILS when it measures it on the wall clock \u2014 the failure mode is two writable primaries, reported by the prober as two confirmed acceptances in one 50 ms round. TIMING ARITHMETIC, all values read from the source rather than chosen: DEFAULT_LEASE_DURATION is 2000 ms (src/governor/lease.rs) and DEFAULT_ELECTION_TIMEOUT_MS is 1000 ms (src/config/constants.rs), so openraft's election window [1000, 2000] ms can hand a candidate the term up to 1000 ms BEFORE the deposed leader's lease \u2014 anchored at its last quorum ack \u2014 can be guaranteed expired. Closing that 1000 ms gap is the hold-down's entire job: it holds promotion for one full lease from the local leader-to-none observation. A forward step of at least the lease (2000 ms) landing after the anchor is stamped and before the promote check satisfies a wall-clock hold-down while no real time has passed. The anchor is stamped roughly one election timeout after the kill (heartbeat 250 ms + election timeout 1000 ms), and the promote check runs after the election and on the reconcile loop's 2000 ms cadence, so the window to hit is only about 1.0 s to 4.0 s after the kill and at most ~3 s wide \u2014 too narrow for a reliable one-shot injection. The injection is therefore a RAMP: +3s, +6s, +9s ... +60s, one write per second, so every 1 s of real time adds 3 s of apparent time. 3 s is the 2000 ms lease plus 1 s of margin, that margin being one ramp period and the whole-second granularity of the faketime file. Whenever the anchor lands, the next ramp write within 1 s already makes the apparent elapsed time exceed a lease, so a wall-clock hold-down releases roughly 1 s before the deposed leader's monotonic lease can have expired. The ramp runs 20 s, spanning the whole stamp-to-check window with about 5x margin, and is applied to node2 AND node3 because either may win. faketime-shift-active is the precondition guard: it proves the same write moves CLOCK_REALTIME and leaves CLOCK_MONOTONIC alone, which is what makes this a wall-clock-only step rather than a step of both clocks.",
      "actions": [
        {
          "type": "transfer_leadership",
          "comment": "Pin leadership on node1 so the kill target is deterministic and the two possible election winners are exactly the two nodes being ramped.",
          "target_node_id": 1
        },
        {
          "type": "wait_cluster",
          "nodes": 3,
          "leaders": 1,
          "timeout_sec": 60
        },
        {
          "type": "sql",
          "comment": "100 acked rows before the failover. If a wall-clock-released promotion produces two writable primaries, this is where diverging or lost acked writes surface.",
          "file": "chaos-oracle-setup.sql",
          "node": "leader"
        },
        {
          "type": "cmd",
          "comment": "Start the +3s-per-second ramp on both candidates, detached so the step returns immediately and the ramp keeps running across the kill. 20 iterations at 1s = a 20s ramp ending at +60s.",
          "cmd": "for n in node2 node3; do docker compose exec -T -d $n sh -c 'for s in $(seq 3 3 60); do echo \"+${s}s\" > /tmp/faketime; sleep 1; done'; done; echo 'ramp armed on node2 and node3'"
        },
        {
          "type": "cmd",
          "comment": "Kill the leader 2s into the ramp (so the ramp is already climbing when the anchor is stamped ~1s later) and probe for 40s in the foreground. The prober's exit code IS the L1 assertion. 40s exceeds the 20s ramp, so the ramp has provably exited before clock_heal below, which would otherwise be overwritten by a later ramp write. Indeterminate budget: node1 is deliberately dead for ~38 of 40s, which alone is 38/40 of its 1/3 share = 0.32 of all probes, close enough to the prober's 0.4 default to be worth raising; 0.45 leaves room for the winner's brief unavailability during promotion while still failing a run that was blind on two nodes.",
          "cmd": "mkdir -p testing/artifacts/dual-writability-promotion-holddown && ( sleep 2; docker compose kill node1 ) >/tmp/ci_holddown_inject.log 2>&1 & ./testing/dual_writability_prober.py --duration 40 --max-indeterminate-rate 0.45 --json testing/artifacts/dual-writability-promotion-holddown/result.json"
        },
        {
          "type": "clock_heal",
          "node": 2
        },
        {
          "type": "clock_heal",
          "node": 3
        },
        {
          "type": "cmd",
          "cmd": "docker compose start node1"
        },
        {
          "type": "wait_cluster",
          "nodes": 3,
          "leaders": 1,
          "timeout_sec": 120
        },
        {
          "type": "sql",
          "file": "chaos-oracle-post.sql",
          "node": "leader"
        }
      ],
      "assertions": [
        {
          "type": "cluster_topology",
          "nodes": 3,
          "leaders": 1
        },
        {
          "type": "metric_leader_count",
          "expected": 1
        },
        {
          "type": "sql",
          "file": "chaos-oracle-assert-survived-and-writable.sql",
          "node": "leader"
        }
      ],
      "cleanup": [
        {
          "type": "clock_heal",
          "comment": "Heal both candidates even if the case failed mid-ramp. Runs after the prober step has returned, by which point the 20s ramp has exited, so this write is the last one.",
          "node": 2
        },
        {
          "type": "clock_heal",
          "node": 3
        },
        {
          "type": "cmd",
          "cmd": "docker compose start node1 2>/dev/null || true",
          "expect_exit": null
