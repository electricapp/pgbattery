          "type": "sql",
          "file": "chaos-oracle-setup.sql",
          "node": "leader"
        },
        {
          "type": "cmd",
          "comment": "30% egress loss on node3 only, applied with --user root. tc needs CAP_NET_ADMIN and the image sets USER postgres, so `docker compose exec` without --user root gets RTNETLINK 'Operation not permitted' \u2014 which is also why this uses a cmd step rather than reaching for a netem step type. The show command afterwards makes the applied qdisc visible in the artifact log, so a silently-unapplied fault is not mistaken for a passing case.",
          "cmd": "docker compose exec -T --user root node3 sh -c 'tc qdisc del dev eth0 root 2>/dev/null; tc qdisc add dev eth0 root netem loss 30%'; docker compose exec -T --user root node3 tc qdisc show dev eth0 | grep -q 'netem' || { echo 'FAIL: netem loss qdisc not present on node3 \u2014 the fault did not apply'; exit 1; }"
        },
