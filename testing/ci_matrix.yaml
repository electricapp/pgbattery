      ],
      "description": "Regression coverage for the pre-rewind divergence check. pg_rewind aligns local data to the source by discarding any WAL the source doesn't have; if the local node had ack'd commits beyond the source LSN (e.g. an ex-leader rejoining after the cluster promoted a follower that didn't see all writes), the rewind silently erases those commits. The supervisor now queries both LSNs before invoking pg_rewind and refuses with `Error::RewindDataLossRisk` when divergence exceeds `PG_REWIND_DIVERGENCE_THRESHOLD_BYTES` (8 KiB). What this case verifies is exactly one property: a healthy leader transfer + rejoin sequence does NOT spuriously trigger the gate (false-positive regression), because a false positive deadlocks failover. It does NOT verify that the metric is exposed \u2014 `pgbattery_pg_rewind_refused_data_loss_risk` is a `describe_counter!`, and the Prometheus exporter emits no HELP or value line for a counter that has never been incremented, so on a healthy cluster the metric is legitimately absent and a presence check would fail while proving nothing about the gate. The assertion below therefore reads an absent line as zero. The positive case (gate actually fires) requires fault injection beyond the standard chaos toolkit and is covered by the supervisor's unit tests (`test_rewind_decision_refuse_beyond_threshold`, etc).",
      "actions": [
        {
          "type": "record_leader",
          "var": "rewind_test_initial_leader"
        },
        {
          "type": "transfer_leadership",
          "target_node_id": 2
        },
