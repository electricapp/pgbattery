      "id": "leader-network-partition-real",
      "tests_md_ref": "Control Plane 11. Real Network Partition (docker network disconnect) [V1]",
      "contracts": [
        "L1",
        "V1"
      ],
      "description": "Severs node1 from the overlay network (not a process pause) and verifies fencing and election. Unlike SIGSTOP, the node cannot communicate with peers at all \u2014 tests the true split-brain path.",
      "actions": [
        {
          "type": "transfer_leadership",
          "target_node_id": 1
        },
        {
          "type": "wait_cluster",
          "nodes": 3,
          "leaders": 1,
          "timeout_sec": 60
        },
        {
          "type": "record_leader",
          "var": "leader_before"
        },
        {
          "type": "cmd",
          "comment": "disconnect node1 from the raft overlay \u2014 process stays alive but cannot reach peers",
          "cmd": "docker network disconnect \"${COMPOSE_PROJECT_NAME:-pgbattery}_raft_net\" \"${COMPOSE_PROJECT_NAME:-pgbattery}-node1-1\""
        },
        {
          "type": "wait_cluster",
          "comment": "Verify the partition triggered a failover: node1 is severed, so a new leader must be elected among the 2 reachable nodes. We do NOT assert replication health here \u2014 that is impossible to satisfy mid-partition: the new leader keeps the severed node1 in pg_stat_replication (as a lagging/async standby) until wal_sender_timeout (~60s) elapses, so a strict '0 async replicas / exactly 1 healthy replica' check races that timeout and flakes. require_replication_health=false checks only topology + that leadership moved off node1; the post-heal wait below re-asserts full health once node1 rejoins.",
          "nodes": 3,
          "live_nodes": 2,
          "leaders": 1,
          "leader_not_var": "leader_before",
          "require_replication_health": false,
          "timeout_sec": 60
        },
        {
          "type": "cmd",
          "comment": "Restore connectivity so node1 can rejoin as follower. --ip is mandatory: `docker network disconnect` destroys the compose-assigned static endpoint, and a bare reconnect picks a dynamic IPAM address, so peers keep dialing the membership address 172.28.0.11 into a void \u2014 node1's outbound RPCs work but inbound replication never arrives, and it campaigns forever (leaders=0 wedge). `docker compose restart` does not re-apply static IPs (restart is not recreate).",
          "cmd": "docker network connect --ip 172.28.0.11 \"${COMPOSE_PROJECT_NAME:-pgbattery}_raft_net\" \"${COMPOSE_PROJECT_NAME:-pgbattery}-node1-1\""
        },
        {
          "type": "cmd",
          "comment": "Restart node1 container so docker host->container port forwarding for 9081/9091 is re-established. Without this restart, network disconnect/connect leaves the published-port iptables/userland-proxy state stale on macOS Docker and host-side requests to localhost:9081 and localhost:9091 time out, even though the container can reach peers fine.",
          "cmd": "docker compose restart node1"
        },
        {
          "type": "wait_cluster",
          "comment": "Demand full replication health (2 healthy followers) AND require it to hold for stable_for_sec before returning. When the partitioned former leader (node1) rejoins it can briefly force one re-election (it campaigned with a bumped term while isolated), so the cluster flickers 1->0->1 leaders for ~an election timeout. A one-shot wait could catch the momentary leaders==1 and return right before the dip, then the cluster_topology assertion below would see leaders=0. Requiring 10s of continuous convergence proves the re-election has settled \u2014 a brief re-election is normal Raft liveness (never 2 leaders == no split-brain), a persistent one still fails here.",
          "nodes": 3,
          "leaders": 1,
          "timeout_sec": 120,
          "min_healthy_replicas": 2,
          "stable_for_sec": 10
        },
        {
          "type": "sleep",
          "comment": "After partition heal, openraft 0.9 keeps replication-to-rejoined-node on a backoff for several seconds before sending heartbeats reliably. Without this settling window, the next test's leadership transfer can land while node1's RaftMetrics::replication[1].matched is still None and the cluster trips the catch-up gate.",
          "seconds": 5
        }
      ],
      "assertions": [
        {
          "type": "cluster_topology",
          "nodes": 3,
          "leaders": 1
        },
        {
          "type": "metric_leader_count",
          "expected": 1
        }
      ]
    },
