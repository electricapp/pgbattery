    {
      "id": "clock-skew-resilience",
      "tests_md_ref": "Control Plane 15. NTP Clock Skew Resilience [V1]",
      "contracts": [
        "L1",
        "W1"
      ],
      "description": "Follower clock skew with a live write workload and a continuous split-brain oracle. Node2's wall clock is jumped +5 minutes via libfaketime (LD_PRELOAD, no SYS_TIME capability needed) while node1 holds leadership and node3 stays healthy, so quorum is retained for the whole window and a mid-skew commit is expected to be acknowledged rather than indeterminate. Two things are checked that a stability-only assertion cannot see: a 25-row batch acked while node2's clock is 5 minutes ahead must still be there at the end (any wall-clock-derived fencing decision on node2 that dropped or duplicated replicated data shows up here), and the dual-writability prober attempts a real write against all three internal PostgreSQL ports every 50 ms for the entire skew window, so a skewed follower that mistakenly considered itself lease-holding and unfenced is caught within one 50 ms round rather than being invisible between matrix steps. Skew magnitude arithmetic: 300 s is 150x DEFAULT_LEASE_DURATION (2 s) and 300x DEFAULT_ELECTION_TIMEOUT_MS (1000 ms), so every wall-clock deadline node2 could be holding is unambiguously in its own past.",
      "actions": [
        {
          "type": "transfer_leadership",
          "comment": "Pin leadership on node1 so the skewed node is a follower and a promotion candidate, not the leader (leader-clock-skew covers the leader case).",
          "target_node_id": 1
        },
        {
          "type": "wait_cluster",
          "nodes": 3,
          "leaders": 1,
          "timeout_sec": 60
        },
        {
          "type": "sql",
          "comment": "100 acked rows before any skew",
          "file": "chaos-oracle-setup.sql",
          "node": "leader"
        },
        {
          "type": "clock_skew",
          "comment": "jump node2 clock +5min via libfaketime; no SYS_TIME cap required",
          "node": 2,
          "seconds": 300
        },
        {
          "type": "sql",
          "comment": "25 rows acked WHILE node2's clock is 5 minutes ahead. Quorum is intact (node1 leader + node3 healthy), so this commit is required to succeed, not merely allowed to. shell_timeout_sec is tightened from the 600s default because a sync-replicated 25-row commit through a healthy node3 is a sub-second operation: if it has not returned in 120s the leader is blocked waiting on the skewed replica, and that is the failure this step exists to surface \u2014 600s would just make it a slower hang.",
          "file": "chaos-oracle-mid.sql",
          "node": "leader",
          "shell_timeout_sec": 120
        },
        {
          "type": "cmd",
          "comment": "Continuous L1 oracle across the skew window. 12s spans 6 lease durations at a 50 ms round period, which is below the 100 ms fence-enforcement tick in src/app.rs, so no single-tick dual-write window can fall between rounds. Exit 1 from the prober means two nodes confirmed a write in the same round; exit 3 means the run was too blind to trust.",
          "cmd": "mkdir -p testing/artifacts/dual-writability-clock-skew-resilience && ./testing/dual_writability_prober.py --duration 12 --json testing/artifacts/dual-writability-clock-skew-resilience/result.json"
        },
        {
          "type": "clock_heal",
          "comment": "restore node2 clock to real time",
          "node": 2
        },
        {
          "type": "wait_cluster",
          "nodes": 3,
          "leaders": 1,
          "timeout_sec": 60
        },
        {
          "type": "sql",
          "file": "chaos-oracle-post.sql",
          "node": "leader"
        }
      ],
      "assertions": [
        {
          "type": "cluster_topology",
          "nodes": 3,
          "leaders": 1
        },
        {
          "type": "metric_leader_count",
          "expected": 1
        },
        {
          "type": "sql",
          "file": "chaos-oracle-assert-full.sql",
          "node": "leader"
        }
      ],
      "cleanup": [
        {
          "type": "clock_heal",
          "comment": "always restore node2 clock even if test fails mid-way",
          "node": 2
        }
      ]
    },
    {
      "id": "asymmetric-leader-partition",
      "tests_md_ref": "Control Plane 13. Asymmetric Partition (leader inbound blocked) [L1]",
      "contracts": [
        "L1",
        "W1",
        "V1"
      ],
      "description": "Blocks inbound Raft traffic to the leader while leaving outbound intact. The leader keeps sending heartbeats so followers never time out on their own \u2014 only lease expiry and fencing on the leader side can resolve this, which makes it the single most dangerous split-brain shape in the matrix: the isolated node1 still has a live, unfenced PostgreSQL while node2/node3 elect a replacement. The dual-writability prober runs for the whole partition window, attempting a real write against all three internal PostgreSQL ports every 50 ms, so a window where both the isolated ex-leader and the new leader accept a write is caught even if it lasts one fence-enforcement tick. The prober reaches PostgreSQL from the host, not from node2/node3, so the iptables DROP rules do not blind it. Data oracle on top: the 100 rows acked before the partition must survive exactly once, and the healed cluster must commit a fresh batch.",
      "actions": [
        {
          "type": "transfer_leadership",
          "target_node_id": 1
        },
        {
          "type": "wait_cluster",
          "nodes": 3,
          "leaders": 1,
          "timeout_sec": 60
        },
        {
          "type": "record_leader",
          "var": "leader_before"
        },
        {
          "type": "sql",
          "comment": "100 acked rows before the partition",
          "file": "chaos-oracle-setup.sql",
          "node": "leader"
        },
        {
          "type": "asymmetric_partition",
          "comment": "Drop all inbound to node1 from node2 and node3 \u2014 node1 cannot hear follower ACKs or votes",
          "node": 1,
          "from_node": 2
        },
        {
          "type": "asymmetric_partition",
          "node": 1,
          "from_node": 3
        },
        {
          "type": "cmd",
          "comment": "L1 oracle across the whole partition window. 25s covers follower election timeout (1000-2000 ms), the winner's promotion, and the deposed leader's lease expiry plus fencing, with ~10x margin. All three containers stay up so the prober is not blind: only Raft inbound to node1 is dropped.",
          "cmd": "mkdir -p testing/artifacts/dual-writability-asymmetric-partition && ./testing/dual_writability_prober.py --duration 25 --json testing/artifacts/dual-writability-asymmetric-partition/result.json"
        },
        {
          "type": "wait_cluster",
          "comment": "require_replication_health must be off while the partition is still up. It defaults ON for a 3-node/1-leader wait, and it cannot be satisfied mid-partition: the new leader keeps the isolated node1 in pg_stat_replication as a lagging/async standby until wal_sender_timeout (~60s) elapses, so the strict '1 Sync + 1 Potential, 0 Async' shape races that timeout. Only topology plus 'leadership moved off node1' is checked here; the post-heal wait below re-asserts full health.",
          "nodes": 3,
          "leaders": 1,
          "leader_not_var": "leader_before",
          "require_replication_health": false,
          "timeout_sec": 60
        },
        {
          "type": "asymmetric_heal",
          "comment": "Restore inbound to node1 so it can rejoin as follower",
          "node": 1,
          "from_node": 2
        },
        {
          "type": "asymmetric_heal",
          "node": 1,
          "from_node": 3
        },
        {
          "type": "wait_cluster",
          "nodes": 3,
          "leaders": 1,
          "timeout_sec": 120
        },
        {
          "type": "sql",
          "file": "chaos-oracle-post.sql",
          "node": "leader"
        }
      ],
      "assertions": [
        {
          "type": "cluster_topology",
          "nodes": 3,
          "leaders": 1
        },
        {
          "type": "sql",
          "file": "chaos-oracle-assert-survived-and-writable.sql",
          "node": "leader"
        }
      ],
      "cleanup": [
        {
          "type": "cmd",
          "comment": "Drain every matching DROP rule on node1, not just one. --user root because the image sets USER postgres and iptables needs CAP_NET_ADMIN/CAP_NET_RAW, which a non-root process does not hold; the while loop because -D removes a single instance and a re-applied fault can leave duplicates that would keep node1 partitioned for every later case. Bounded by the loop terminating as soon as -D fails.",
          "cmd": "for ip in 172.28.0.12 172.28.0.13; do while docker compose exec -T --user root node1 iptables -D INPUT -s $ip -j DROP 2>/dev/null; do echo \"removed DROP from $ip\"; done; done; docker compose exec -T --user root node1 iptables -S INPUT 2>/dev/null || true",
          "expect_exit": null
        }
      ]
    },
    {
      "id": "leader-clock-skew",
      "tests_md_ref": "Control Plane 16. Leader Clock Skew [V1]",
      "contracts": [
        "L1",
        "W1"
      ],
      "description": "Skew applied to the node that is losing leadership \u2014 the combination that matters. Node1 is made leader, then its wall clock jumps +5 minutes while the dual-writability prober is already running. A +300 s step is 150 lease durations, so any wall-clock-derived expiry check on node1 fires immediately and it self-steps-down while node2/node3 elect a replacement; the danger is a window where the stepped-down node1 has not yet been fenced but the replacement is already writable. The prober attempts a real write against all three internal PostgreSQL ports every 50 ms across the whole window, which is the only way that window is observable: it can be shorter than the 100 ms fence-enforcement tick, let alone shorter than a gap between matrix steps. The 100 rows acked before the skew must also survive exactly once, and the healed cluster must commit a fresh batch. No mid-skew batch here: node1 may be mid-step-down for the whole window, so a commit at that moment is legitimately indeterminate and asserting on it would flake (clock-skew-resilience covers the mid-fault-write case, where quorum is provably retained).",
