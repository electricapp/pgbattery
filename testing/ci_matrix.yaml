    {
      "id": "gateway-connection-survival",
      "tests_md_ref": "Control Plane 13. Gateway Connection Migration [S2]",
      "contracts": [
        "S2"
      ],
      "description": "Verifies connection migration, the gateway's headline behaviour, with two independent oracles instead of a metric-presence check. Three GENUINELY IDLE sessions are held open through node2's gateway (which proxies to leader node1); idleness is load-bearing, because ConnectionState::is_migratable requires tx_status Idle with no response pending \u2014 a session parked inside `SELECT pg_sleep(...)` has a response outstanding and is severed by design, so a case built on one would be asserting the wrong branch. The case therefore polls node2's pgbattery_connections_idle until it reports the 3 held sessions before injecting any fault. Node1 is then killed and (1) node2's pgbattery_connections_migrated counter must rise above zero, and (2) at least one of the held sessions must complete an INSERT on its ORIGINAL client connection after the new leader is elected. The 1-of-3 lower bound is what S2 actually guarantees: severing is permitted (if the new leader's PostgreSQL is not accepting yet, the reconnect fails and the session gets SQLSTATE 08006), zero migrations is not. Note that pgbattery_connections_migrated is a describe_counter!, so the Prometheus exporter emits no line for it at all until the first increment \u2014 an absent line is read as 0 rather than as a missing metric.",
      "actions": [
        {
          "type": "transfer_leadership",
          "target_node_id": 1
        },
        {
          "type": "wait_cluster",
          "nodes": 3,
          "leaders": 1,
          "timeout_sec": 60
        },
        {
          "type": "sql",
          "comment": "Landing table for the post-failover writes the held sessions make.",
          "file": "gateway-migration-setup.sql",
          "node": 1
        },
        {
          "type": "cmd",
          "comment": "Hold 3 idle sessions through node2's gateway. Each runs one SELECT, goes idle for 25s (long enough that its next statement lands after a single-node-kill failover has completed), then writes its own row on the same connection. Feeding psql from a brace group keeps the session parked at ReadyForQuery with nothing outstanding \u2014 the only state the gateway will migrate.",
          "cmd": "docker compose exec -T node2 sh -lc 'for i in 1 2 3; do ( { printf \"SELECT 1;\\n\"; sleep 25; printf \"INSERT INTO ci_gateway_migration(session_id) VALUES (%s);\\n\" \"$i\"; sleep 5; } | psql -U postgres -h 127.0.0.1 -p 5432 -d postgres >/tmp/ci_gw_idle_$i.out 2>&1 & ); done; sleep 2; echo held'"
        },
        {
          "type": "cmd",
          "comment": "Gate on node2 reporting 3 idle gateway connections before any fault. Without this the kill could land while a session is still authenticating or still awaiting its first ReadyForQuery, which is a severing path, not a migration path.",
          "cmd": "for i in $(seq 1 20); do IDLE=$(curl -s http://localhost:9092/metrics | awk '/^pgbattery_connections_idle/{print $2}' | head -1); IDLE=${IDLE:-0}; IDLE=${IDLE%%.*}; echo \"attempt $i: node2 idle=$IDLE\"; [ \"$IDLE\" -ge 3 ] && exit 0; sleep 1; done; echo 'FAIL: node2 never reported 3 idle gateway connections \u2014 nothing migratable is being held'; curl -s http://localhost:9092/metrics | grep -E '^pgbattery_connections'; exit 1"
        },
        {
          "type": "record_leader",
          "var": "leader_before"
        },
        {
          "type": "cmd",
          "cmd": "docker compose kill node1"
        },
        {
          "type": "wait_cluster",
          "nodes": 3,
          "live_nodes": 2,
          "leaders": 1,
          "leader_not_var": "leader_before",
          "timeout_sec": 60
        },
        {
          "type": "cmd",
          "comment": "Direct migration oracle: node2's gateway must report at least one migrated connection. Absent counter line == 0 increments == the gateway dropped every idle session. Severed is printed for diagnosis but not gated on, since S2 permits severing.",
          "cmd": "for i in $(seq 1 30); do MIG=$(curl -s http://localhost:9092/metrics | awk '/^pgbattery_connections_migrated/{print $2}' | head -1); MIG=${MIG:-0}; MIG=${MIG%%.*}; if [ \"$MIG\" -ge 1 ]; then echo \"node2 migrated=$MIG after ${i}s\"; curl -s http://localhost:9092/metrics | grep -E '^pgbattery_connections_(migrated|severed)'; exit 0; fi; sleep 1; done; echo 'FAIL: pgbattery_connections_migrated never incremented on node2 \u2014 connection migration did not happen'; curl -s http://localhost:9092/metrics | grep -E '^pgbattery_connections'; exit 1"
        },
        {
          "type": "cmd",
          "comment": "Wait for the held sessions' post-failover INSERT statements (issued 25s after they were opened) to land, so the SQL oracle below reads a settled table rather than racing the sessions.",
          "cmd": "for i in $(seq 1 60); do N=$(docker compose exec -T node2 psql -U postgres -h 127.0.0.1 -p 5432 -d postgres -tAc 'SELECT count(*) FROM ci_gateway_migration;' 2>/dev/null | tr -d '[:space:]'); echo \"attempt $i: rows=${N:-unreadable}\"; [ \"${N:-0}\" -ge 1 ] && exit 0; sleep 1; done; echo 'no post-failover row from any held session yet'; docker compose exec -T node2 sh -lc 'for f in /tmp/ci_gw_idle_*.out; do echo \"--- $f\"; cat $f; done' || true; exit 1"
        },
        {
          "type": "cmd",
          "cmd": "docker compose start node1"
        },
        {
          "type": "wait_cluster",
          "nodes": 3,
          "leaders": 1,
          "timeout_sec": 60
        }
      ],
      "assertions": [
        {
          "type": "sql",
          "comment": "End-to-end oracle: how many held sessions wrote on their original connection after the leader changed.",
