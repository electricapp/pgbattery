      "id": "faketime-shift-active",
      "tests_md_ref": "BUGS.md: libfaketime not actually installed in container",
      "contracts": [
        "L1"
      ],
      "description": "Precondition oracle for every clock-skew case, and therefore a coverage guard on L1 rather than a direct L1 measurement: it pins down WHAT the FAKETIME LD_PRELOAD machinery injects, in both directions. (1) Writing +30s to /tmp/faketime must move CLOCK_REALTIME by 25\u201335s \u2014 if it does not, every skew case is a silent no-op and their L1 coverage has evaporated. (2) The same write must leave CLOCK_MONOTONIC within a few seconds of real elapsed time, because the split between the two clocks is the entire mechanism promotion-holddown-clock-step depends on: a wall-clock-only step is what separates a hold-down measured on SystemTime from a lease measured on Instant. FAKETIME_DONT_FAKE_MONOTONIC is not set in docker-compose.yml, so monotonic invariance is a property of the installed libfaketime rather than of our configuration \u2014 this assertion is what notices if a rebuild changes it. Both clocks are sampled from one in-container perl process so they share a single faketime view.",
      "actions": [],
      "assertions": [
        {
          "type": "cmd",
          "cmd": "docker compose exec -T node1 sh -c 'echo \"+0s\" > /tmp/faketime; sleep 1; set -- $(perl -MTime::HiRes=clock_gettime,CLOCK_MONOTONIC,CLOCK_REALTIME -e \"printf(qq{%d %d}, clock_gettime(CLOCK_REALTIME), clock_gettime(CLOCK_MONOTONIC))\"); R0=$1; M0=$2; echo \"+30s\" > /tmp/faketime; sleep 1; set -- $(perl -MTime::HiRes=clock_gettime,CLOCK_MONOTONIC,CLOCK_REALTIME -e \"printf(qq{%d %d}, clock_gettime(CLOCK_REALTIME), clock_gettime(CLOCK_MONOTONIC))\"); R1=$1; M1=$2; echo \"+0s\" > /tmp/faketime; RD=$((R1-R0)); MD=$((M1-M0)); echo \"realtime_delta=${RD}s monotonic_delta=${MD}s\"; [ \"$RD\" -ge 25 ] && [ \"$RD\" -le 35 ] || { echo \"FAIL: faketime did not move CLOCK_REALTIME by ~+30s \u2014 every clock-skew case is a no-op\"; exit 1; }; [ \"$MD\" -ge 0 ] && [ \"$MD\" -le 5 ] || { echo \"FAIL: faketime moved CLOCK_MONOTONIC by ${MD}s \u2014 wall-clock-only skew is not injectable, so promotion-holddown-clock-step no longer discriminates\"; exit 1; }'"
        }
      ]
    },
