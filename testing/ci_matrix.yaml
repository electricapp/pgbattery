          "cmd": "mkdir -p testing/artifacts/dual-writability-leader-clock-skew && ( sleep 3; docker compose exec -T node1 sh -c \"echo '+300s' > /tmp/faketime\" ) >/tmp/ci_leader_skew_inject.log 2>&1 & ./testing/dual_writability_prober.py --duration 30 --json testing/artifacts/dual-writability-leader-clock-skew/result.json"
        },
