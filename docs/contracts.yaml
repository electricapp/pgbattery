# Machine registry for correctness contracts.
# Narrative lives in docs/CONTRACTS.md; lint reads this file for IDs,
# severities, and FATAL inversions — not markdown headings/tables.
#
# Every matrix case `contracts:` entry must name an `id` below.
# FATAL rows must list at least one inversion that still exists as a
# matrix case id, repo path, or Rust/Python function name.

contracts:
  W1:
    severity: FATAL
    title: ACKed Write Durability
    inversions:
      - assert-sanity-acked
      - assert-sanity-acked-dup
      - assert-sanity-chaos-oracle
      - assert-sanity-chaos-oracle-post
      - assert-sanity-chaos-oracle-full
      - testing/durability_crash.py
      - testing/torn_write.py
      - testing/wal_enospc.py

  W2:
    severity: FATAL
    title: At-Most-Once Write Delivery
    inversions:
      - assert-sanity-concurrent
      - assert-sanity-cascade-atomicity
      - test_duplicate_ledger_row_flags_b3

  W3:
    severity: FATAL
    title: DDL Atomicity
    inversions:
      - assert-sanity-ddl

  L1:
    severity: FATAL
    title: Single Writable Leader
    inversions:
      - test_two_confirmed_acceptances_is_a_fatal_violation
      - test_split_brain_signal_flags_l2

  L2:
    severity: FATAL
    title: Lease-Fenced Write Rejection
    inversions:
      - test_contained_ack_is_fatal_i5
      - test_fence_failure_signal_flags_l2

  L3:
    severity: FATAL
    title: LSN-Safe Election
    inversions:
      - test_emergency_fence_without_confirmation_flags_l3
      - testing/torn_raft.py

  V1:
    severity: SLO
    title: Failover Availability Window

  V2:
    severity: SLO
    title: Diverged / WAL-hole Recovery
    inversions:
      - assert-sanity-diverged

  S1:
    severity: FATAL
    title: Commit Visibility / Prepared Tx
    inversions:
      - assert-sanity-commit-boundary

  S2:
    severity: SLO
    title: Gateway Session Continuity
    inversions:
      - assert-sanity-gateway-migration

  R1:
    severity: FATAL
    title: No Replication Slot Leak
    inversions:
      - assert-sanity-slot-leak

  R2:
    severity: FATAL
    title: Synchronous Replica Acknowledgment
    inversions:
      - assert-sanity-acked-dup
      - testing/durability_crash.py
      - testing/torn_write.py
      - testing/torn_raft.py

  # Covered by linearizability_register / Elle; no ### heading in CONTRACTS.md.
  LIN:
    severity: FATAL
    title: Linearizability (single-register)
    prose: false
    inversions:
      - testing/test_checker_sanity.py
      - assert_flagged

  # Every inversion below is a test or model that FAILS when the mechanism it
  # names is removed. A source file, or a happy-path unit test, satisfies the
  # lint without being able to go red — which is the failure this registry
  # exists to prevent.
  U1:
    severity: FATAL
    title: Cross-Cluster Single Write Authority
    inversions:
      - tla/cutover_authority.inv-green-self-elect.cfg
      - test_a_cluster_without_authority_never_reports_holding_it
      - test_a_fence_that_covers_nothing_is_refused

  U2:
    severity: FATAL
    title: Cutover Drain Completeness
    inversions:
      - test_a_drain_short_of_the_final_lsn_is_refused
      - test_matching_row_counts_do_not_prove_a_drain

  U3:
    severity: FATAL
    title: Sequence Non-Collision
    inversions:
      - test_an_unadvanced_sequence_is_caught
      - test_a_sequence_that_setval_cannot_reach_is_refused

  U4:
    severity: FATAL
    title: Fail-Closed Cutover
    inversions:
      - tla/cutover_authority.inv-green-self-elect.cfg
      - test_an_unconfirmable_authority_holds_rather_than_guessing

  U5:
    severity: FATAL
    title: Reverse-Drain Completeness
    inversions:
      - test_a_write_missing_from_the_reverse_stream_is_caught
      - test_a_transfer_without_a_reverse_slot_is_refused
