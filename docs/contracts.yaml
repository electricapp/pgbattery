# Machine registry for correctness contracts.
# Narrative lives in docs/CONTRACTS.md; lint reads this file for IDs,
# severities, and FATAL inversions — not markdown headings/tables.
#
# Every matrix case `contracts:` entry must name an `id` below.
# FATAL rows must list at least one inversion that still exists as a
# matrix case id, repo path, or Rust/Python function name.

