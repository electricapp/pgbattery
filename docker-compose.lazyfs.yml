# 3-node topology with PGDATA on LazyFS, parallel to `docker-compose.yml`.
#
# The only cluster in this repo where an un-fsynced write can actually be lost.
# Every other compose file runs PGDATA on an ordinary filesystem, where `docker
# kill` leaves the host page cache intact and therefore cannot discard anything
# PostgreSQL wrote but did not flush. That is why W1 and R2 have until now
# rested on construction rather than evidence.
#
# Separate project name, subnet, and host ports so this cluster can coexist
# with the 3-node and 5-node ones and no fault injection can reach across.
#
# Requires PGBATTERY_MANAGEMENT_API_TOKEN, like the other compose files.
#
# Deliberately omits the libfaketime LD_PRELOAD that the other files set. This
# suite injects no clock skew, and preloading a time-interception library into
# the process that owns the page cache would put a second unrelated variable
# inside the one test whose whole purpose is attributing lost writes.
name: pgbatterylazyfs

x-lazyfs-node: &lazyfs-node
  build:
    context: .
    target: runtime-lazyfs
  restart: unless-stopped
  # Starts as root so the entrypoint can mount FUSE; it drops to postgres
  # before exec'ing pgbattery, because PostgreSQL refuses to run as root.
  user: root
  # SYS_ADMIN plus the fuse device is the minimum for a FUSE mount inside a
  # container. AppArmor is unconfined because the default docker profile
  # denies mount(2) outright on hosts that ship it.
  cap_add: [NET_ADMIN, SYS_ADMIN]
  devices:
    - /dev/fuse
  security_opt:
    - apparmor:unconfined
  environment:
    - RUST_LOG=info
    - PGBATTERY_MANAGEMENT_API_TOKEN=${PGBATTERY_MANAGEMENT_API_TOKEN:?set in .env or shell}

services:
  node1:
    <<: *lazyfs-node
    hostname: node1
    command: ["pgbattery-lazyfs", "pgbattery", "run", "--bootstrap"]
    volumes:
      - ./config/lazyfs/node1.toml:/app/pgbattery.toml:ro
      - node1_state:/var/lib/postgresql
    ports:
      - "5452:5432"
      - "9291:9090"
      - "9281:9091"
    networks:
      raft_net:
        ipv4_address: 172.30.0.11

  node2:
    <<: *lazyfs-node
    hostname: node2
    command:
      [
        "pgbattery-lazyfs",
        "pgbattery",
        "join",
        "--peer",
        "172.30.0.11:9091",
        "--node-id",
        "2",
        "--voter",
      ]
    volumes:
      - ./config/lazyfs/node2.toml:/app/pgbattery.toml:ro
      - node2_state:/var/lib/postgresql
    ports:
      - "5453:5432"
      - "9292:9090"
      - "9282:9091"
    networks:
      raft_net:
        ipv4_address: 172.30.0.12

  node3:
    <<: *lazyfs-node
    hostname: node3
    command:
      [
        "pgbattery-lazyfs",
        "pgbattery",
        "join",
        "--peer",
        "172.30.0.11:9091",
        "--node-id",
        "3",
        "--voter",
      ]
    volumes:
      - ./config/lazyfs/node3.toml:/app/pgbattery.toml:ro
      - node3_state:/var/lib/postgresql
    ports:
      - "5454:5432"
      - "9293:9090"
      - "9283:9091"
    networks:
      raft_net:
        ipv4_address: 172.30.0.13

  # One bare PostgreSQL on LazyFS, for the torn-write suite (H-25). Inert
  # unless started explicitly:
  #
  #   docker compose -f docker-compose.lazyfs.yml --profile tornwrite up -d pg
  #
  # It lives here rather than in a file of its own because it needs exactly
  # this substrate — the same image stage, entrypoint, and LazyFS config as the
  # durability cluster — and because `topology.py` reads whichever compose file
  # is active. A service publishing none of the pgbattery ports is skipped there
  # as a sidecar, so this one is invisible to the node-level harnesses while
  # node1..node3 still resolve normally.
  #
  # No pgbattery and no Raft: what is under test is PostgreSQL's handling of a
  # half-written page. Running that on the cluster would put a failover, a
  # pg_rewind and a possible re-basebackup between the tear and the assertion,
  # any of which could repair the page for reasons unrelated to the property.
  pg:
    profiles: [tornwrite]
    build:
      context: .
      target: runtime-lazyfs
    user: root
    # The suite runs initdb and the postmaster itself: it needs to create,
    # tear and recover the cluster under its own control rather than have a
    # supervisor restart things underneath it.
    command: ["pgbattery-lazyfs", "sleep", "infinity"]
    # The runtime stage health-checks pgbattery's management API. Nothing
    # serves it here, so the inherited check could only ever fail — but
    # disabling it outright is not the answer either: `docker compose up
    # --wait` fails on a service with no healthcheck, so the suite would have
    # no readiness signal at all and would start tearing at whatever state the
    # container happened to be in.
    #
    # This probes the readiness that actually matters here, and it is the same
    # pair of facts the entrypoint refuses to start without: both stores on
    # LazyFS, and both fault workers consuming their control FIFO. A mount
    # without a reader accepts every fault command and executes none.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          grep -qE " /var/lib/postgresql/data fuse" /proc/mounts
          && grep -qE " /var/lib/postgresql/raft fuse" /proc/mounts
          && grep -q "waiting for fault commands" /tmp/lazyfs.log
          && grep -q "waiting for fault commands" /tmp/lazyfs-raft.log
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    # No restart policy: the tear kills LazyFS, and a restart would race the
    # suite's inspection of the backing store, which is the only place the
    # torn page is visible.
    cap_add: [SYS_ADMIN]
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined
    volumes:
      - tornwrite_state:/var/lib/postgresql
    networks:
      raft_net:
        ipv4_address: 172.30.0.20

networks:
  raft_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16

# Ordinary persistent named volumes. The crash test depends on state surviving
# `docker compose kill` + `start`: the LazyFS backing root lives here, and what
# it contains after a restart is precisely the evidence the suite collects.
# A tmpfs variant would come back empty and make every assertion vacuous.
volumes:
  node1_state:
  node2_state:
  node3_state:
  tornwrite_state:
