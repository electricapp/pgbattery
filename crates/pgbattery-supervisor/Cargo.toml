[package]
name = "pgbattery-supervisor"
description = "PostgreSQL process supervision for pgbattery: start/stop/promote/demote, idempotent. No knowledge of Raft or the gateway."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pgbattery-core = { path = "../pgbattery-core" }
tokio = { version = "1", features = ["full"] }
# pgbattery's own sessions to the local server: one protocol round trip per
# query, SQLSTATE on every error, nothing to tear when a caller times out.
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
# Counts the statements in a query before it is sent: see `session::one_statement`.
pg_query = "6"
tracing = "0.1"
metrics = "0.24"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
flate2 = "1"
tar = "0.4"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
# Property-based tests over the pure pg_rewind divergence gate.
proptest = "1"

[lints]
workspace = true
