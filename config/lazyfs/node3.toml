# LazyFS durability-suite variant of ../node3.toml.
# Identical except for the 172.30.0.0/16 subnet that keeps this cluster
# isolated from the 3-node and 5-node ones. pg_data_dir is unchanged: the
# entrypoint mounts LazyFS *at* /var/lib/postgresql/data, so PostgreSQL is
# pointed at the same path and reaches the FUSE filesystem instead.

node_id = 3
listen_addr = "0.0.0.0:5432"
raft_addr = "0.0.0.0:5433"
metrics_addr = "0.0.0.0:9090"
pg_bin_dir = "/usr/lib/postgresql/18/bin"
pg_data_dir = "/var/lib/postgresql/data"
pg_internal_port = 5434
pg_auth_mode = "trust"

# Advertise addresses (what other nodes use to reach this node)
advertise_raft_addr = "172.30.0.13:5433"
advertise_mgmt_addr = "172.30.0.13:9091"

election_timeout_ms = 1000
heartbeat_interval_ms = 250

[[peers]]
id = 1
raft_addr = "172.30.0.11:5433"
pg_addr = "172.30.0.11:5434"

[[peers]]
id = 2
raft_addr = "172.30.0.12:5433"
pg_addr = "172.30.0.12:5434"
