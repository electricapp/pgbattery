\* Nightly model for commit_probing: a third connection, more transactions.
\*
\* The PR config runs two connections, which is the smallest model in which one
\* client's probe can observe another's transaction. A third makes a probe
\* concurrent with two in-flight commits rather than one, and MaxTxid 4 lets a
\* connection reach its second transaction while an earlier one is still
\* unresolved — the shape a client retrying after an indeterminate COMMIT
\* actually produces.
CONSTANTS
    Connections = {c1, c2, c3}
    Nodes = {1, 2, 3}
    MaxTxid = 4
    ElectionRequiresReplicatedTxns = TRUE

SPECIFICATION Spec

INVARIANTS
    ProbeCommittedImpliesVisible
    ProbeAbortedImpliesNotWritten
    ResponseImpliesConsistentState
    ReplicatedImpliesProbeFindsIt
    AckedSuccessIsDurable
