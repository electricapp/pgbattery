# Spec → code map for TLA+ models.
# lint_matrix resolves these paths/symbols against the workspace.
# Spec header comments may still describe the mapping for humans;
# this file is the machine registry.

[lease_fencing]
"governor/reconciler/follow.rs" = ["promotion_lease_holddown"]
"governor/reconciler/mod.rs" = ["open_writes"]
"governor/lease.rs" = [
  "expires_at",
  "is_valid",
  "promotion_anchor",
  "quorum_ack_age",
  "renew",
  "spend_failover_anchor",
]
"governor/raft.rs" = [
  "QUORUM_TIMEOUT_MS",
  "has_quorum",
  "millis_since_quorum_ack",
  "should_anchor_term_advance",
  "should_clear_stale_failover_anchor",
]

[raft_lsn]
"config/constants.rs" = ["LSN_CATCHUP_THRESHOLD_BYTES_ASYNC"]
"governor/network.rs" = ["LocalWal", "VoteFrame", "vote_lsn_gate"]
"governor/state_machine.rs" = ["vote_lsn_threshold_bytes"]

[timeline_verification]
"crates/pgbattery-supervisor/src/process/controldata.rs" = [
  "PG_CONTROLDATA_TIMEOUT_MS",
  "receiver_info",
  "run_pg_controldata",
  "timeline_id",
  "verify_promotion_safe",
]
"crates/pgbattery-supervisor/src/process/follow.rs" = [
  "get_wal_receiver_timeline",
  "received_tli",
]
"crates/pgbattery-supervisor/src/process/rewind.rs" = ["run_pg_rewind"]

[cutover_authority]
"governor/state_machine.rs" = [
  "CutoverArmed",
  "CutoverSeal",
  "CutoverDrainObserved",
  "CutoverTransfer",
  "CutoverAbortUnseal",
  "CutoverAuthorityReceived",
  "CutoverAuthorityState",
  "CutoverPhase",
  "NameCluster",
  "holds_client_write_authority",
]
"governor/raft.rs" = [
  "cutover_authority_projection",
  "client_write_authority",
  "authority_pg_addr",
]
"observability/management_api/cutover.rs" = [
  "cutover_arm",
  "holds_authority",
  "cutover_seal",
  "cutover_transfer",
  "cutover_force_transfer",
  "cutover_receive_authority",
]
"commands/upgrade/blue_green.rs" = [
  "run_blue_green_preflight",
  "run_local_blue_green_preflight",
]
"commands/upgrade/client_fence.rs" = [
  "apply_client_write_fence",
  "lift_client_write_fence",
]
