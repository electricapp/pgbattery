\* EXPECT-VIOLATION: TimelineMonotonic
\*
\* What `TimelineMonotonic` is for, kept as a config rather than as a paragraph
\* telling someone to edit a constant and see for themselves.
\*
\* Without the defect below no action in this spec can lower a timeline, so the
\* property passes whether or not it means anything — the vacuity every other
\* assertion in this repo is refused for. `RewindAdoptsSourceTimeline = TRUE`
\* enables `RewindOntoPrimary`, which is a pg_rewind run without consulting the
\* divergence gate: a standby that promoted inside a partition, and is therefore
\* ahead of the primary it is being rewound onto, takes the source's lower
\* timeline and silently discards the history it forked.
\*
\* TLC finds it in a few steps: node 1 leads on timeline 1, node 2 promotes in
\* a partition to timeline 2, then the rewind puts node 2 back to 1. That
\* backwards step is the violation. `rewind_divergence_decision` is the code
\* that refuses it, covered by its own Rust property tests; this model is what
\* keeps the spec's claim about it honest.
SPECIFICATION Spec

CONSTANTS
    Nodes = {1, 2, 3}
    MaxTimeline = 3
    RewindAdoptsSourceTimeline = TRUE

CONSTRAINT StateConstraint

INVARIANT TypeOK

PROPERTY TimelineMonotonic
