SPECIFICATION Spec

\* The safety proof depends on the RATIOS, not the absolute values:
\*   QuorumTimeout < LeaseDuration <= HoldDown        (the code: 1s < 2s, HoldDown = 2s)
\*   HoldDown >= VoteDelay + QuorumTimeout            (the load-bearing one)
\* Small tick counts keep the state space tiny; every variable is bounded by one
\* of these constants, and there is no global clock, so no MaxTime is needed.
\*
\* VoteDelay = 1 is one tick of network flight for a candidacy to reach a
\* majority. It is the assumption the design cannot escape: with QuorumTimeout at
\* 1 s and the hold-down at 2 s, a vote that takes longer than 1 s to land leaves
\* the deposed leader's self-fence trailing the winner's promotion.
\*
\* MaxTerm = 3 is the smallest bound that reaches the interesting shape: term 1
\* bootstraps, term 2 is a candidacy that does not win, term 3 is the one that
\* does — which is the retry an anchor stamped at first observation counts out
\* under.
CONSTANTS
    Nodes = {1, 2, 3}
    QuorumTimeout = 2
    LeaseDuration = 4
    HoldDown = 4
    VoteDelay = 1
    MaxTerm = 3
    RestampAnchorOnCampaign = TRUE

INVARIANTS
    TypeOK
    AtMostOneWriteAuthority
    SelfFenceOnQuorumLoss
    WritableImpliesLeaseLeader
    OneLeaderPerTerm

\* NON-VACUITY is not a comment here: `lease_fencing.inv-anchor-not-restamped.cfg`
\* flips RestampAnchorOnCampaign to FALSE and `make -C tla
\* check-lease_fencing-counterexample` requires TLC to report an
\* AtMostOneWriteAuthority violation from it.
