SPECIFICATION Spec

\* The tick is the unit and the binary sets its length: LeaseDuration ticks are
\* one DEFAULT_LEASE_DURATION, and on that scale QuorumTimeout and HoldDown must
\* land on the milliseconds pgbattery ships. Not restated here — lint_matrix.py's
\* "TLA models state the shipped timings" derives the scale and checks all three,
\* so a retuned constant fails the lint instead of leaving TLC proving something
\* about a system nobody runs. The relationships between them are the spec's own
\* ASSUME clauses. Every variable is bounded by one of these constants and there
\* is no global clock, so no MaxTime is needed.
\*
\* VoteDelay is the network flight a candidacy has to reach a majority, and it
\* sits at the boundary those timings admit — HoldDown - QuorumTimeout exactly.
\* It is the assumption the design cannot escape: a vote slower than that leaves
\* the deposed leader's self-fence trailing the winner's promotion. A smaller
\* value explores only the interior of the safe region, which is not where an
\* off-by-one in the argument would show.
\*
\* MaxTerm = 3 is the smallest bound that reaches the interesting shape: term 1
\* bootstraps, term 2 is a candidacy that does not win, term 3 is the one that
\* does — which is the retry an anchor stamped at first observation counts out
\* under.
CONSTANTS
    Nodes = {1, 2, 3}
    QuorumTimeout = 2
    LeaseDuration = 4
    HoldDown = 4
    VoteDelay = 2
    MaxTerm = 3
    RestampAnchorOnCampaign = TRUE

INVARIANTS
    TypeOK
    AtMostOneWriteAuthority
    SelfFenceOnQuorumLoss
    WritableImpliesLeaseLeader
    OneLeaderPerTerm

\* NON-VACUITY is not a comment here: `lease_fencing.inv-anchor-not-restamped.cfg`
\* flips RestampAnchorOnCampaign to FALSE and `make -C tla
\* check-lease_fencing-counterexample` requires TLC to report an
\* AtMostOneWriteAuthority violation from it.
