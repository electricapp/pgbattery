\* EXPECT-VIOLATION: ElectionSafety
\*
\* What `ElectionSafety` is for, kept as a config rather than as a paragraph
\* telling someone to edit a constant and see for themselves.
\*
\* `EnforceOneVotePerTerm = FALSE` drops one conjunct from `CanVoteFor`: that a
\* voter which has already backed someone this term may not back anyone else.
\* That conjunct is Raft's at-most-one-leader-per-term argument in its entirety,
\* and it is the one the LSN gate above it explicitly does not provide — the
\* spec header records that TLC disproves leader freshness and that safety rests
\* here instead.
\*
\* TLC then finds the split vote directly: two candidates campaign in the same
\* term, the same follower grants both, each reaches quorum, and the cluster has
\* two leaders in one term. Only ElectionSafety is listed, so a violation of
\* anything else is reported as failing for the wrong reason rather than
\* silently standing in for this one.
SPECIFICATION Spec

CONSTANT Nodes = {1, 2, 3}
CONSTANT MaxTerm = 3
CONSTANT MaxLSN = 2
CONSTANT LSNLagThreshold = 1
CONSTANT EnforceOneVotePerTerm = FALSE

INVARIANT ElectionSafety

CONSTRAINT StateConstraint
