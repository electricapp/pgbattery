SPECIFICATION Spec

\* PR model: two epochs of headroom past the initial blue epoch so Transfer
\* and AbortUnseal are both reachable; AllowGreenSelfElect stays FALSE so U4
\* cannot be violated by the defect action.
CONSTANTS
    MaxEpoch = 2
    AllowGreenSelfElect = FALSE
    AllowGreenSelfArm = FALSE

INVARIANTS
    TypeOK
    AtMostOneWriteAuthority
    GreenWritesOnlyAfterTransfer
    NoStaleAttestationReplay
    FailClosedWhenBlueUnreachable

\* Monotonicity relates successive states, so it is a PROPERTY, not an
\* INVARIANT — as a single-state formula it could only restate TypeOK.
PROPERTIES
    EpochsNeverDecrease
    AuthorityNeverReturnsSilently
