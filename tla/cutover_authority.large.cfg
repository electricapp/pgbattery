\* Nightly model for cutover_authority: one more epoch of headroom.
\*
\* Epochs are the productive axis — each Transfer/ForceTransfer/AbortUnseal
\* consumes one. MaxEpoch = 3 lets a cutover abort and re-arm then transfer
\* inside one behaviour, and lets green fall a full epoch behind blue before
\* accepting. Clusters stay two; node count is not this protocol's axis.
SPECIFICATION Spec

CONSTANTS
    MaxEpoch = 3
    AllowGreenSelfElect = FALSE
    AllowGreenSelfArm = FALSE

INVARIANTS
    TypeOK
    AtMostOneWriteAuthority
    GreenWritesOnlyAfterTransfer
    NoStaleAttestationReplay
    FailClosedWhenBlueUnreachable

PROPERTIES
    EpochsNeverDecrease
    AuthorityNeverReturnsSilently
