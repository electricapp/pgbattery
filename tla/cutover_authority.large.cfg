\* Nightly model for cutover_authority: one more epoch of headroom.
\*
\* Epochs are the productive axis — each Transfer/AbortUnseal consumes one.
\* MaxEpoch = 3 lets a cutover abort and re-arm then transfer inside one
\* behaviour. Clusters stay two (blue/green); node count is not this protocol's
\* axis. Measured small: PR MaxEpoch=2 finishes in well under a second.
SPECIFICATION Spec

CONSTANTS
    MaxEpoch = 3
    AllowGreenSelfElect = FALSE

INVARIANTS
    TypeOK
    AtMostOneWriteAuthority
    EpochMonotonic
    GreenWritesOnlyAfterTransfer
    FailClosedWhenBlueUnreachable
    WritableMatchesAuthority
