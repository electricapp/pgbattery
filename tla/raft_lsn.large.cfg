\* Nightly model for raft_lsn: four nodes, a wider LSN range.
\*
\* Four rather than five deliberately. This spec carries a term *and* an LSN per
\* node, so the state space multiplies on several dimensions at once; at five
\* nodes TLC was still 66M states from done after ten minutes, while four nodes
\* with MaxLSN 3 finishes in well under a minute. Raising MaxLSN buys more here
\* than raising the node count: the LSN gate is what this spec is about, and a
\* third distinct LSN value is what lets "behind by more than the threshold" and
\* "behind by exactly the threshold" both appear in one behaviour.
\*
\* Measured at 7.0M distinct states in ~28 s (M4, -workers auto).
\*
\* The invariant list is the PR config's, including what it deliberately omits:
\* TLC disproves LeaderHasAcceptableLSN and LeaderLSNNotBelowVoters at three
\* nodes already, so a larger model would only reproduce a known result.
CONSTANT Nodes = {1, 2, 3, 4}
CONSTANT MaxTerm = 3
CONSTANT MaxLSN = 3
CONSTANT LSNLagThreshold = 1
CONSTANT EnforceOneVotePerTerm = TRUE

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT ElectionSafety
INVARIANT NoLSNDeadlock
INVARIANT SomeNodeCanWin

CONSTRAINT StateConstraint
