\* Nightly model for timeline_verification: five nodes, more timelines.
\*
\* Timelines advance once per promotion, so MaxTimeline bounds how many
\* failovers a behaviour can contain. Five nodes and five timelines let a fork
\* be created, healed, and re-created — the sequence a repeatedly-partitioned
\* cluster produces, and the one where a node can rejoin on a timeline that
\* diverged two promotions ago.
SPECIFICATION Spec

CONSTANTS
    Nodes = {1, 2, 3, 4}
    MaxTimeline = 4

CONSTRAINT StateConstraint

INVARIANT TypeOK

PROPERTY TimelineMonotonic

\* NoDualPrimariesSameTimeline stays unchecked here for the same reason as in
\* the PR config: it is FALSE in the partition model, and a bigger model only
\* finds the same counter-example sooner.
