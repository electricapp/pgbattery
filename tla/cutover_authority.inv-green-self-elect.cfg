\* EXPECT-VIOLATION: FailClosedWhenBlueUnreachable
\*
\* AllowGreenSelfElect = TRUE models a green cluster that lifts its own fence
\* on a local timeout while blue is unreachable mid-cutover, instead of on an
\* attestation of a committed AUTHORITY_TRANSFERRED. That is contract U4's
\* inversion, and it is the shape a config-only fence would have.
\*
\* GreenWritesOnlyAfterTransfer and NoStaleAttestationReplay are omitted here:
\* the defect also breaks them, and TLC must report the U4 invariant named
\* above rather than a different one first.
SPECIFICATION Spec

CONSTANTS
    MaxEpoch = 2
    AllowGreenSelfElect = TRUE

INVARIANTS
    TypeOK
    AtMostOneWriteAuthority
    FailClosedWhenBlueUnreachable
