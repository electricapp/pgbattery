\* EXPECT-VIOLATION: FailClosedWhenBlueUnreachable
\*
\* AllowGreenSelfElect = TRUE models a green cluster that takes write authority
\* while blue is unreachable mid-cutover (no AUTHORITY_TRANSFERRED in blue's
\* log). That is contract U4's inversion: fail-closed cutover.
\*
\* GreenWritesOnlyAfterTransfer is omitted here: the defect also breaks it, and
\* TLC must report the U4 invariant named above — not a different one first.
SPECIFICATION Spec

CONSTANTS
    MaxEpoch = 2
    AllowGreenSelfElect = TRUE

INVARIANTS
    TypeOK
    AtMostOneWriteAuthority
    EpochMonotonic
    FailClosedWhenBlueUnreachable
    WritableMatchesAuthority
