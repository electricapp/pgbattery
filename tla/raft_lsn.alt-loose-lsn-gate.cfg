\* raft_lsn at the loose end of the LSN gate. The spec header's simplification 3
\* says which two thresholds the binary picks between and why one model checks
\* one of them; this is the second run it asks for.
\*
\* Not redundant with raft_lsn.cfg. The tight end is where NoLSNDeadlock and
\* SomeNodeCanWin bite, because a narrower gate admits fewer candidates and is
\* where an election can wedge. A gate that binds less reaches states the tight
\* model cannot — a leader further behind than the tight gate would ever have
\* admitted — and ElectionSafety has to hold there too.
\*
\* MaxLSN = 3 because a threshold of 2 is only distinguishable from a vacuous
\* one when a node can be 3 behind. At MaxLSN = 2 this would check the tight
\* model with the gate switched off rather than a looser gate.
CONSTANT Nodes = {1, 2, 3}
CONSTANT MaxTerm = 3
CONSTANT MaxLSN = 3
CONSTANT LSNLagThreshold = 2
CONSTANT EnforceOneVotePerTerm = TRUE

SPECIFICATION Spec

\* The PR config's list, and it omits the same two: TLC disproves
\* LeaderHasAcceptableLSN and LeaderLSNNotBelowVoters at the tight gate already,
\* and a looser one can only disprove them harder.
INVARIANT TypeOK
INVARIANT ElectionSafety
INVARIANT NoLSNDeadlock
INVARIANT SomeNodeCanWin

CONSTRAINT StateConstraint
