\* Nightly model for lease_fencing: three nodes, one more term.
\*
\* Terms are this spec's productive axis, and node count is not. Quorums here
\* are explicit node sets rather than an ack counter, which is what makes the
\* RW-1 shape reachable — and it also means every extra node multiplies the
\* majorities each election and each heartbeat ack can range over. Measured on
\* an M4 with `-workers auto`: five nodes did not finish in 15 minutes at either
\* MaxTerm 5 or MaxTerm 3, while three nodes at MaxTerm 4 completes in 55 s at
\* 1,548,245 distinct states, against 492,689 in 2 s for the PR model.
\*
\* The extra term is what the PR model cannot reach: at MaxTerm 3 a node
\* bootstraps, loses one candidacy and wins the next, which is exactly enough to
\* exercise the anchor. MaxTerm 4 lets a node be deposed, return, and be deposed
\* again inside one behaviour, so a stale anchor has a second chance to surface.
\*
\* Node count is not free coverage here either way: three nodes already has the
\* minimal quorum intersection (majorities of two overlapping in one), which is
\* the shape the safety argument turns on.
\*
\* The ratios are the PR config's, unchanged:
\*   QuorumTimeout < LeaseDuration <= HoldDown
\*   HoldDown >= VoteDelay + QuorumTimeout
SPECIFICATION Spec

CONSTANTS
    Nodes = {1, 2, 3}
    QuorumTimeout = 2
    LeaseDuration = 4
    HoldDown = 4
    VoteDelay = 1
    MaxTerm = 4
    RestampAnchorOnCampaign = TRUE

INVARIANTS
    TypeOK
    AtMostOneWriteAuthority
    SelfFenceOnQuorumLoss
    WritableImpliesLeaseLeader
    OneLeaderPerTerm
