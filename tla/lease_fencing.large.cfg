\* Nightly model for lease_fencing: five nodes, two more terms.
\*
\* The PR config is three nodes and MaxTerm 3, which is the smallest model that
\* can exhibit a two-leader state at all. Five nodes admits quorum shapes three
\* cannot — in particular a deposed leader keeping a quorum that excludes the
\* eventual winner, which is exactly the shape RW-1's argument turns on — and
\* the extra terms let a node be deposed, return, and be deposed again inside
\* one behaviour.
\*
\* Measured at 4.8M distinct states in ~13 s (M4, -workers auto). The ratios are
\* the PR config's, unchanged: QuorumTimeout < LeaseDuration <= HoldDown.
SPECIFICATION Spec

CONSTANTS
    Nodes = {1, 2, 3, 4, 5}
    QuorumTimeout = 2
    LeaseDuration = 4
    HoldDown = 4
    MaxTerm = 5

INVARIANTS
    TypeOK
    AtMostOneWriteAuthority
    SelfFenceOnQuorumLoss
    WritableImpliesLeaseLeader
