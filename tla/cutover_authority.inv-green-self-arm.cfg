\* EXPECT-VIOLATION: AtMostOneWriteAuthority
\*
\* AllowGreenSelfArm = TRUE models a recipient arming itself from its virgin
\* log: arming records authority for the local cluster, so without the arm
\* handler's holds-authority guard one authenticated call makes green writable
\* while blue still holds epoch 0. That is contract U1's inversion — the
\* timeout-free sibling of the green-self-elect defect.
\*
\* GreenWritesOnlyAfterTransfer is omitted here: the defect also breaks it,
\* and TLC must report the U1 invariant named above rather than a different
\* one first.
SPECIFICATION Spec

CONSTANTS
    MaxEpoch = 2
    AllowGreenSelfElect = FALSE
    AllowGreenSelfArm = TRUE

INVARIANTS
    TypeOK
    AtMostOneWriteAuthority
