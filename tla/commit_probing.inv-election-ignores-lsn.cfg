\* EXPECT-VIOLATION: AckedSuccessIsDurable
\*
\* What the LSN election gate buys, kept as a config rather than as a paragraph
\* telling someone to edit a constant and see for themselves.
\*
\* `ElectionRequiresReplicatedTxns = FALSE` drops one conjunct from
\* `ElectNewLeader`: the requirement that a new leader already hold every
\* replicated transaction. That conjunct is the spec's model of contract V1 —
\* `evaluate_lsn_acceptable` refusing a candidate behind `max_cluster_lsn`.
\*
\* TLC then finds the lost acknowledged commit directly: a connection commits, the
\* transaction reaches the sync replica, the client is told it succeeded, the
\* leader crashes, and a node that never saw the transaction is elected. The
\* client holds an ack for a write the cluster no longer has — contract W1,
\* FATAL. Everything else matches the PR model.
SPECIFICATION Spec

CONSTANTS
    Connections = {c1, c2}
    Nodes = {1, 2, 3}
    MaxTxid = 3
    ElectionRequiresReplicatedTxns = FALSE

INVARIANTS
    AckedSuccessIsDurable
