\* EXPECT-VIOLATION: AtMostOneWriteAuthority
\*
\* The counterexample this spec exists to produce, kept as a config rather than
\* as a paragraph telling someone to edit a constant and see for themselves.
\*
\* RestampAnchorOnCampaign = FALSE models the promotion hold-down anchored at the
\* winner's FIRST observation of leaderlessness instead of at the candidacy it
\* goes on to win. Everything else matches the PR model. TLC then finds the RW-1
\* shape: node A leads and keeps acking a majority that excludes node C; C
\* campaigns, fails, waits out the whole hold-down, campaigns again and wins on a
\* quorum without A; C's hold-down has already counted out, so it promotes at the
\* instant it wins, while A's last ack is one tick old and its quorum-loss
\* self-fence is still QuorumTimeout away. Both hold write authority — contract
\* L1, FATAL.
\*
\* The ASSUME that sizes the hold-down (HoldDown >= VoteDelay + QuorumTimeout) is
\* guarded on the same flag, because an ASSUME failure aborts TLC before it can
\* reach the invariant, and "the model was rejected" is not a counterexample.
SPECIFICATION Spec

CONSTANTS
    Nodes = {1, 2, 3}
    QuorumTimeout = 2
    LeaseDuration = 4
    HoldDown = 4
    VoteDelay = 1
    MaxTerm = 3
    RestampAnchorOnCampaign = FALSE

INVARIANTS
    TypeOK
    AtMostOneWriteAuthority
    SelfFenceOnQuorumLoss
    WritableImpliesLeaseLeader
    OneLeaderPerTerm
